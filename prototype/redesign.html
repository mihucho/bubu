<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>布布的学习小天地 · 前端重设计原型 v2</title>
<style>
/* ============ 设计令牌（对齐 DESIGN.md / 最终方案 v2.0） ============ */
:root{
  /* 孩子端品牌 */
  --k-pink:#FF85C1; --k-pink-soft:#FFB3D9; --k-pink-50:#FFD7EC; --k-pink-tint:#FFF5FA;
  --k-purple:#A855F7; --k-purple-soft:#C4A6F5; --k-purple-50:#EDE0FD;
  --k-grad-hero:linear-gradient(180deg,#FFB3D9 0%,#C4A6F5 100%);
  --k-grad-cta:linear-gradient(135deg,#DB2777 0%,#7C3AED 100%);
  /* 文字 */
  --k-text:#4A2666; --k-text-strong:#2E1065; --k-text-sub:#7C4FB0;
  --k-bg:linear-gradient(180deg,#FFF0F5 0%,#F3E8FF 100%);
  --k-surface:#FFFFFF; --k-surface-2:#FBF7FF; --k-border:#FFD7EC;
  /* 语义 */
  --k-gold:#FFD700; --k-gold-text:#A16207; --k-success:#22C55E; --k-success-text:#15803D; --k-success-bg:#F0FDF4;
  /* 尺寸 — 孩子端 */
  --tap-primary:72px; --tap-secondary:56px; --tap-gap:16px;
  --nav-h:72px; --nav-label:12px; --nav-safe-gap:12px;
  --task-row-h:88px; --chip-plus:56px; --chest-cell:32px; --chest-seg-w:24px; --chest-seg-h:20px;
  --hero-h:132px; --bubble-h:76px; --world-h:86px;
  --fs-display:32px; --fs-title:22px; --fs-card:18px; --fs-body:16px; --fs-note:14px; --fs-micro:12px;
  /* 形 */
  --r-sm:14px; --r-md:18px; --r-card:24px; --r-lg:30px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  /* clay 双阴影：外层彩色投影（抬升）+ 内层顶部高光（膨胀感） */
  --clay-card:0 10px 22px rgba(150,90,205,.13), 0 2px 6px rgba(150,90,205,.07),
              inset 0 2px 0 rgba(255,255,255,.95);
  --clay-card-press:0 4px 10px rgba(150,90,205,.12), 0 1px 3px rgba(150,90,205,.08),
              inset 0 2px 0 rgba(255,255,255,.85);
  --clay-float:0 18px 40px rgba(120,60,170,.22), inset 0 3px 0 rgba(255,255,255,.9);
  --clay-ico:0 3px 8px rgba(150,90,205,.16), inset 0 1px 0 rgba(255,255,255,.95);
  --shadow-card:var(--clay-card);
  --shadow-float:var(--clay-float);
  /* 家长端 */
  --p-bg:#F8F9FB; --p-surface:#FFF; --p-border:#E7E5EE;
  --p-text:#1B1230; --p-text-sub:#6B6480; --p-accent:#7C3AED; --p-accent-weak:#F3E8FF;
  --p-control:40px; --p-control-sm:36px; --p-fs-body:14px;
  /* 孩子主色 */
  --kid-a:#FF85C1; --kid-b:#5AA9E6; --kid-c:#4ADE80; --kid-d:#FBBF24;
}
.ic,.av-ic{display:block}
.hero .name small .ic{display:inline-block;vertical-align:-3px;margin-left:3px}
.tc,.give,.pmeta,.ws{display:inline-flex;align-items:center;gap:3px}
.prow .ic,.kv .ic,.pps .ic{display:inline-block;vertical-align:-2px;margin-right:2px}
.pcard .pav{width:40px;height:40px}
.pcard .pav .av-ic{width:32px;height:32px}
.stamp .ic{margin:0}
.ring .av-ic{width:52px;height:52px}
.av .av-ic{width:44px;height:44px}
.pav .av-ic{width:26px;height:26px}
.cam{display:inline-flex;align-items:center;gap:2px}
.ws .ic,.mb .ic{display:inline-block;vertical-align:-2px;margin-right:2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"HarmonyOS Sans SC","MiSans","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  background:#EFEAF6;color:var(--k-text);display:flex;height:100vh;overflow:hidden;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
/* ============ 评审台布局 ============ */
.rail{width:212px;flex:0 0 212px;background:#fff;border-right:1px solid #E7E5EE;padding:16px 12px;overflow:auto}
.rail h1{font-size:13px;margin:0 0 4px;color:#1B1230}
.rail .sub{font-size:11px;color:#6B6480;margin-bottom:14px;line-height:1.5}
.rail .grp{font-size:10px;letter-spacing:.04em;color:#6E6684;margin:14px 0 6px;
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.rail .grp::before{content:"▾";font-size:9px;color:#8C84A0;transition:.15s}
.rail .grp.closed::before{transform:rotate(-90deg)}
.rail .grp .cnt{margin-left:auto;font-weight:400;color:#7E7396;font-size:10px}
.rail .grp.closed + button{display:none}
.rail .grp.closed ~ *:not(.grp){}
.railsearch{margin:0 0 4px}
.railsearch input{width:100%;height:30px;border-radius:9px;border:1px solid #E7E5EE;background:#FAF9FD;
  padding:0 10px;font-size:12px;color:#1B1230;outline:none}
.railsearch input:focus{border-color:#C4A6F5;background:#fff}
.rail .hidden{display:none !important}
.rail button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;font-size:12.5px;color:#1B1230;text-align:left;line-height:1.35}
.rail button:hover{background:#F6F4FB}
.rail button.on{background:var(--p-accent-weak);color:#6D28D9;font-weight:600}
.rail .dot{width:6px;height:6px;border-radius:50%;background:#D6CFE6}
.rail button.on .dot{background:#7C3AED}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}
.notes{width:264px;flex:0 0 264px;background:#fff;border-left:1px solid #E7E5EE;padding:18px 16px;overflow:auto;font-size:12px;line-height:1.65;color:#4B4360}
.notes h2{font-size:13px;margin:0 0 8px;color:#1B1230}
.notes h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6E6684;margin:16px 0 6px}
.notes ul{margin:0;padding-left:16px}
.notes code{background:#F3EFFA;padding:1px 5px;border-radius:5px;font-size:11px;color:#6D28D9}
.notes .tag{display:inline-block;background:#F3E8FF;color:#6D28D9;border-radius:6px;padding:1px 7px;font-size:10.5px;margin:0 4px 4px 0}
/* ============ 手机壳 ============ */
.phone{
  width:375px;height:min(780px,calc(100vh - 16px));border-radius:38px;background:#111;padding:10px;
  box-shadow:0 24px 60px rgba(40,20,70,.28);flex:0 0 auto;
}
.screen{
  width:100%;height:100%;border-radius:29px;overflow:hidden;position:relative;
  background:
    radial-gradient(120% 60% at 12% 0%, #FFE4F1 0%, transparent 55%),
    radial-gradient(110% 70% at 96% 18%, #EDE0FD 0%, transparent 60%),
    #F7F2FD;
  display:flex;flex-direction:column;
}
/* 状态条省略（规范：孩子端不显示系统状态栏内容） */
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
/* ============ 头图 ============ */
.hero{
  height:var(--hero-h);background:var(--k-grad-hero);padding:18px 16px 0;
  display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
}
.hero .name{font-size:var(--fs-title);font-weight:800;color:var(--k-text-strong);letter-spacing:.2px;
  text-shadow:0 1px 0 rgba(255,255,255,.55)}
.hero .name small{font-size:var(--fs-note);font-weight:500;opacity:.75;margin-left:4px}
.chest{background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.85);border-radius:var(--r-md);padding:10px 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 4px 12px rgba(120,60,160,.10)}
.chest .row{display:flex;align-items:center;gap:6px}
.cell{width:var(--chest-cell);height:var(--chest-cell);border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.55);border:2px solid rgba(168,85,247,.22);font-size:15px;transition:.35s}
.cell.open{background:linear-gradient(170deg,#FFEBA8,#FFC53D);border-color:#F2A500;
  box-shadow:0 3px 10px rgba(240,165,0,.38), inset 0 2px 0 rgba(255,255,255,.8)}
.chest .left{margin-left:auto;font-size:var(--fs-note);font-weight:600;color:var(--k-text-strong)}
.chest .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.55);margin-top:8px;overflow:hidden}
.chest .bar i{display:block;height:100%;width:37.5%;border-radius:4px;background:linear-gradient(90deg,#FF85C1,#A855F7);transition:width .5s}
/* ============ 布布说 ============ */
.bubble{
  height:var(--bubble-h);margin:-12px 12px 0;background:#fff;border-radius:var(--r-card);
  box-shadow:0 6px 14px rgba(150,90,205,.10), inset 0 2px 0 rgba(255,255,255,.95);border:1.5px solid rgba(255,255,255,.9);display:flex;align-items:center;gap:10px;padding:0 14px;
  font-size:var(--fs-note);font-weight:500;color:var(--k-text);cursor:pointer;
}
.bubble .ava{width:36px;height:36px;border-radius:50%;background:var(--k-purple-50);flex:0 0 36px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.bubble .txt{flex:1;line-height:1.45}
.bubble .arrow{color:var(--k-text-sub);font-size:16px}
/* ============ 任务区 ============ */
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:22px 16px 10px}
.sech span{font-size:18px;font-weight:800;color:var(--k-text)}
.sech em{font-style:normal;font-size:12px;font-weight:700;color:var(--k-text-sub)}
.cyc{font-size:10.5px;font-weight:700;color:#8B7FA8;background:#F4EEFB;border-radius:6px;padding:1px 6px}
.sec{padding:var(--sp-5) var(--sp-4) var(--sp-2);font-size:var(--fs-card);font-weight:700;color:var(--k-text)}
.tasks{padding:0 var(--sp-4) 0;display:flex;flex-direction:column;gap:var(--sp-3)}
.task{
  height:var(--task-row-h);background:#fff;border:1.5px solid rgba(255,255,255,.9);border-radius:var(--r-card);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-3) 0 var(--sp-4);
  box-shadow:var(--clay-card);cursor:pointer;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1), box-shadow .16s ease, background .2s;
  position:relative;overflow:visible;
}
.task:active{transform:translateY(2px) scale(.985);box-shadow:var(--clay-card-press);background:var(--k-pink-tint)}
.task.near{border-color:rgba(255,133,193,.55);box-shadow:0 0 0 3px rgba(255,133,193,.18), var(--clay-card)}
.task.done{background:var(--k-success-bg);border-color:rgba(34,197,94,.5);box-shadow:0 10px 22px rgba(34,197,94,.14), inset 0 2px 0 rgba(255,255,255,.9)}
.task .ico{position:relative;width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  color:#fff;flex:0 0 44px;
  background:linear-gradient(180deg,#BE97F2,#8E5BE0);
  box-shadow:0 5px 12px rgba(142,91,224,.30), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 6px rgba(90,40,150,.18);
  transition:transform .18s cubic-bezier(.34,1.5,.64,1)}
.ico.i-book{background:linear-gradient(180deg,#BE97F2,#8E5BE0);box-shadow:0 5px 12px rgba(142,91,224,.30), inset 0 2px 0 rgba(255,255,255,.45)}
.ico.i-bag{background:linear-gradient(180deg,#FFC98F,#F29434);box-shadow:0 5px 12px rgba(242,148,52,.30), inset 0 2px 0 rgba(255,255,255,.5)}
.ico.i-broom{background:linear-gradient(180deg,#FFB0D4,#EF5F9E);box-shadow:0 5px 12px rgba(239,95,158,.30), inset 0 2px 0 rgba(255,255,255,.5)}
.ico.i-calc{background:linear-gradient(180deg,#9AD4FF,#4E9FE8);box-shadow:0 5px 12px rgba(78,159,232,.30), inset 0 2px 0 rgba(255,255,255,.5)}
.ico.i-egg{background:linear-gradient(180deg,#FFE08A,#F2B21A);box-shadow:0 5px 12px rgba(242,178,26,.30), inset 0 2px 0 rgba(255,255,255,.5)}
.task:active .ico{transform:scale(.94)}
.task .ico img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.task .mid{flex:1;min-width:0}
.task .ttl{font-size:var(--fs-body);font-weight:700;color:var(--k-text);display:flex;align-items:center;gap:6px;line-height:1.25}
.task .cam{font-size:11px;background:var(--k-purple-50);color:var(--k-text-sub);border-radius:6px;padding:1px 5px;font-weight:600}
.task .cam.req{background:#DB2777;color:#fff}
.task .meta{display:flex;align-items:center;gap:6px;margin-top:5px;white-space:nowrap;overflow:hidden}
.dots{display:flex;gap:3px;flex:0 0 auto}
.dots i{width:9px;height:9px;border-radius:50%;background:#EADCF7;display:block}
.dots i.on{background:var(--k-purple)}
.task.done .dots i.on{background:var(--k-success)}
.task.done::after{content:"";position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #7DE7A3, #22C55E 70%);
  box-shadow:0 3px 8px rgba(34,197,94,.45), inset 0 2px 0 rgba(255,255,255,.55);
  -webkit-mask:radial-gradient(circle, transparent 45%, #000 46%);
  mask:radial-gradient(circle, transparent 45%, #000 46%)}
.task.done::before{content:"";position:absolute;left:1px;top:2px;width:8px;height:5px;z-index:2;
  border-left:2.4px solid #fff;border-bottom:2.4px solid #fff;transform:rotate(-45deg)}
.give{font-size:var(--fs-micro);font-weight:600;color:var(--k-gold-text)}
.task.done .give{color:var(--k-success-text)}
.plus{
  width:var(--chip-plus);height:var(--chip-plus);border-radius:var(--r-pill);flex:0 0 var(--chip-plus);
  background:var(--k-grad-cta);color:#fff;font-size:15px;font-weight:800;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px rgba(219,39,119,.34), inset 0 2px 0 rgba(255,255,255,.45);
  transition:transform .16s cubic-bezier(.34,1.5,.64,1), box-shadow .16s ease;
}
.plus:active{transform:translateY(2px) scale(.94);box-shadow:0 2px 6px rgba(219,39,119,.30), inset 0 2px 0 rgba(255,255,255,.35)}
.task.done .plus{background:#E7F8EC;color:var(--k-success-text);box-shadow:none;font-size:12px}
.task .stamp{position:absolute;right:64px;top:50%;transform:translateY(-50%) scale(1.6);opacity:0;
  font-size:22px;pointer-events:none;transition:.3s}
.task .stamped .stamp{opacity:1;transform:translateY(-50%) scale(1)}
.thumb{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:7px;z-index:2;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
/* 飞行星星 */
.fly{position:fixed;width:18px;height:18px;z-index:999;pointer-events:none;font-size:18px}
/* 骨架屏 */
.sk{background:linear-gradient(90deg,#F1ECF8 25%,#FAF7FE 50%,#F1ECF8 75%);background-size:200% 100%;
  animation:shimmer 1.2s infinite linear;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-title{height:22px;border-radius:8px}
.sk-chest{height:58px;border-radius:16px;margin-top:12px}
.sk-task{pointer-events:none;background:#fff;border-color:#F3EDFA!important;box-shadow:none!important}

/* 离线提示条 */
.netbar{flex:0 0 auto;height:32px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:#FFF6DC;color:#8A6A00;font-size:11.5px;font-weight:700}
.warnbox{margin:16px;padding:12px 14px;border-radius:14px;background:#FFF9E6;border:1px solid #FFE9A8;
  color:#7A5B00;font-size:12.5px;line-height:1.6}

/* 照片查看器 */
.viewer{height:100%;display:flex;flex-direction:column;background:#15101F}
.vbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;flex:0 0 auto}
.vbar span{flex:1;text-align:center;font-size:13px;color:rgba(255,255,255,.8)}
.vbar button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.vimg{flex:1;display:flex;align-items:center;justify-content:center;padding:0 20px}
.vpicture{width:100%;height:62%;border-radius:18px;background:linear-gradient(180deg,#FBF8FF,#EFE6FA);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8B7FA8;font-size:12px;font-weight:700}
.vfoot{display:flex;gap:10px;padding:16px 20px 24px}
.vfoot .btn-l{flex:1}

/* 分钟选择器 */
.minpicker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minpicker button{height:52px;border-radius:14px;background:#F7F1FE;color:var(--k-text-sub);font-size:18px;font-weight:800;
  display:flex;align-items:baseline;justify-content:center;gap:3px}
.minpicker button em{font-style:normal;font-size:11px;font-weight:700}
.minpicker button.on{background:var(--k-grad-cta);color:#fff;box-shadow:0 4px 12px rgba(219,39,119,.24)}

/* 运动类型 */
.typegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.typebtn{height:56px;border-radius:14px;background:#F7F1FE;color:var(--k-text-sub);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px}
.typebtn.on{background:linear-gradient(180deg,#FFF0F7,#F3E8FE);color:#DB2777;box-shadow:inset 0 0 0 2px #FF85C1}

/* 心愿定价 */
.pricebox{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 8px}
.priceval{display:flex;align-items:baseline;gap:6px;min-width:120px;justify-content:center}
.priceval b{font-size:38px;font-weight:800;color:var(--k-text-strong);letter-spacing:-.02em}
.priceval span{font-size:13px;font-weight:700;color:#8B7FA8}
.pstep{width:46px;height:46px;font-size:20px;font-weight:800;padding:0;justify-content:center}

/* 拖动把手 */
.drag{width:36px;height:36px;border-radius:10px;background:#F7F1FE;display:flex;align-items:center;justify-content:center;color:#9A93AC}
.coach.big{font-size:13px;padding:11px 15px}

/* 环境切换 */
.envsw{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:2px 0 6px}
.envsw button{height:30px;border-radius:8px;background:#F4EEFB;color:#6D3FA0;font-size:11.5px;font-weight:700}
.envsw button.on{background:var(--k-grad-cta);color:#fff}
.envtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#6D28D9;
  background:#F3E8FF;border-radius:6px;padding:3px 8px;margin-bottom:8px}

.offnote{text-align:center;font-size:12.5px;color:#8B7FA0;font-weight:600;padding:4px 0}

.memo{display:flex;gap:10px;align-items:flex-start;margin:0 14px 10px;padding:12px 14px;
  border-radius:16px;background:#fff;box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9)}
.memo-ic{width:28px;height:32px;border-radius:9px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;
  background:#FFE4F0;color:#DB2777}
.memo-t{font-size:13.5px;font-weight:800;color:#4A2666}
.memo-s{font-size:12px;color:#8B7FA0;margin-top:2px}

/* 聊天输入 */
.chatin{flex:1;height:56px;border-radius:999px;background:#fff;display:flex;align-items:center;padding:0 18px;
  font-size:14px;color:#7E7396;box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9)}
.sendbtn{width:56px;height:56px;border-radius:50%;flex:0 0 56px;background:var(--k-grad-cta);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(219,39,119,.3), inset 0 2px 0 rgba(255,255,255,.4)}
.sendbtn:active{transform:scale(.94)}

/* 语音录制 */
.rec-wave{display:flex;align-items:center;justify-content:center;gap:6px;height:72px;margin-bottom:10px}
.rec-wave i{width:8px;border-radius:4px;background:linear-gradient(180deg,#FF85C1,#A855F7);height:18px;
  animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:14px;opacity:.55}50%{height:52px;opacity:1}}
.rec-tip{text-align:center;font-size:13px;color:var(--k-text-sub);font-weight:600;margin-bottom:8px}
.mic.rec-on{background:linear-gradient(135deg,#DC2626,#DB2777);
  box-shadow:0 6px 18px rgba(219,39,119,.34), inset 0 2px 0 rgba(255,255,255,.4)}

/* 头像网格 */
.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.avg-item{aspect-ratio:1/1;border-radius:20px;background:#F7F1FE;display:flex;align-items:center;justify-content:center;
  border:2px solid transparent}
.avg-item.on{border-color:#A855F7;background:linear-gradient(180deg,#FFF0F7,#F3E8FE);
  box-shadow:0 4px 12px rgba(168,85,247,.18)}

/* 站内消息列表 */
.mlist{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:16px;padding:13px 14px;
  box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9);position:relative;cursor:pointer}
.mrow.unread{border-color:#FFD7EC;background:linear-gradient(180deg,#FFFBFD,#FFF6FA)}
.mico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px}
.m-heart{background:linear-gradient(180deg,#FFB0D4,#EF5F9E);box-shadow:0 4px 10px rgba(239,95,158,.28)}
.m-gift{background:linear-gradient(180deg,#FFE08A,#F2B21A);box-shadow:0 4px 10px rgba(242,178,26,.28)}
.m-star{background:linear-gradient(180deg,#BE97F2,#8E5BE0);box-shadow:0 4px 10px rgba(142,91,224,.28)}
.m-map{background:linear-gradient(180deg,#9AD4FF,#4E9FE8);box-shadow:0 4px 10px rgba(78,159,232,.28)}
.mtxt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.mtxt b{font-size:13.5px;font-weight:800;color:var(--k-text)}
.mtxt span{font-size:12.5px;color:var(--k-text-sub);line-height:1.55}
.mdot{width:8px;height:8px;border-radius:50%;background:#DB2777;flex:0 0 8px;margin-top:6px}

/* 休息墙呼吸环 */
.breathring{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,#fff 55%,#E6F0FF 100%);
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(120,160,220,.25);
  animation:breathe 4s ease-in-out infinite}
.br-inner{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#5A93E6}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}

/* 平板宽壳 */
.phone.wide{width:760px;height:min(700px,calc(100vh - 16px))}
.phone.wide .screen{border-radius:22px}

/* 导出预览卡 */
.exportcard{width:100%;background:#fff;border-radius:20px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.3)}
.ex-top{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px dashed #EFE6F9}
.ex-top b{display:block;font-size:14px;font-weight:800;color:#2E1065}
.ex-top span{font-size:11px;color:#8B7FA8}
.ex-title{font-size:18px;font-weight:800;color:#2E1065;margin:14px 0 8px}
.ex-body{font-size:13px;line-height:1.8;color:#4B4360}
.ex-foot{margin-top:22px;padding-top:12px;border-top:1px dashed #EFE6F9;font-size:11px;color:#7E7396;text-align:center;line-height:1.8}
.ex-foot i{display:block;font-style:normal;font-size:10px;color:#C9BEDC;margin-top:2px}

/* 错题照片 */
.qshots{display:flex;gap:10px;margin-top:4px}
.qshot{width:84px;height:84px;border-radius:14px;background:#FBF8FF;border:1.5px dashed #D9C9F0;color:#7C64A6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}
.qshot.filled{border-style:solid;border-color:#A855F7;background:linear-gradient(180deg,#FFF,#F5EEFF);color:#6D3FA0}
.qphoto{height:160px;border-radius:14px;background:linear-gradient(180deg,#FBF8FF,#F3EBFF);border:1.5px solid #E7DAF7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#8B7FA8;font-size:12px;font-weight:700}

/* 豆包登录 */
.doubaobtn{width:100%;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:9px;
  background:#1B1230;color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 6px 18px rgba(27,18,48,.24), inset 0 2px 0 rgba(255,255,255,.14)}
.db-mark{width:24px;height:24px;border-radius:50%;background:#FFD700;color:#1B1230;display:flex;align-items:center;justify-content:center}

/* 引导：勾选框 */
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;line-height:1.65;color:#1B1230}
.agree .cb{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:2px solid #C9BEE0;margin-top:1px}
/* 引导：头像选择 */
.avpick{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  border:2px solid #F1E4FA;box-shadow:0 2px 8px rgba(150,90,205,.12)}
.avpick.add{border-style:dashed;color:#9A93AC;font-size:18px}
/* 答题 */
.qbig{font-size:30px;font-weight:800;color:#2E1065;text-align:center;padding:22px 0 6px}
.qans{height:64px;border-radius:18px;background:#fff;border:2px solid #E7DAF7;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:#2E1065;box-shadow:var(--clay-card)}
.qkeys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.qkeys button{height:52px;border-radius:14px;background:#fff;font-size:20px;font-weight:800;color:#2E1065;box-shadow:var(--clay-card)}
/* 法律文本 */
.legal h3{font-size:14px;font-weight:800;color:#1B1230;margin:18px 0 6px}
.legal p{font-size:13px;line-height:1.8;color:#4B4360;margin:0}
/* 教练气泡 */
.coach{margin:12px 16px 0;padding:9px 13px;border-radius:12px;background:#FFF9E6;border:1px solid #FFE9A8;
  color:#7A5B00;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* 徽章墙 */
.badgegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 96px}
.badge-card{background:#fff;border-radius:20px;padding:16px 12px;text-align:center;
  box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9);opacity:.55}
.badge-card.got{opacity:1;background:linear-gradient(180deg,#FFFBEA,#FFF4D6);border-color:#FFE08A}
.bc-ico{width:52px;height:52px;border-radius:16px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
  background:var(--k-purple-50);color:#7C3AED}
.badge-card.got .bc-ico{background:#fff;color:#A16207;box-shadow:var(--clay-ico)}
.bc-name{font-size:13px;font-weight:800;color:var(--k-text)}
.bc-st{font-size:11px;color:#7E7396;margin-top:3px}

/* 空态 */
.empty-demo{margin:0 16px 16px;padding:26px 18px;background:#fff;border-radius:24px;text-align:center;
  box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;gap:8px}
.emo-ico{width:88px;height:88px;border-radius:28px;background:linear-gradient(180deg,#FFF0F7,#F3E8FE);
  display:flex;align-items:center;justify-content:center;color:#A855F7}
.emo-t{font-size:17px;font-weight:800;color:var(--k-text);margin-top:4px}
.emo-s{font-size:13px;color:var(--k-text-sub);line-height:1.6;margin-bottom:8px}

/* ============ 详情页通用 ============ */
.dhead{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(180deg,#FFE6F2,#F3E8FE);border-radius:0 0 16px 16px}
.dback{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;
  color:var(--k-text-sub)}
.dtitle{flex:1;text-align:center;font-size:15px;font-weight:800;color:var(--k-text-strong)}
.dhero{padding:18px 16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.dname{font-size:20px;font-weight:800;color:var(--k-text)}
.dmeta{font-size:12.5px;color:var(--k-text-sub);line-height:1.5}
.dsec{padding:18px 16px 8px;font-size:14px;font-weight:800;color:var(--k-text)}
.dlist{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.drow{background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9)}
.drow-l{flex:1;display:flex;flex-direction:column;gap:2px}
.drow-l b{font-size:13.5px;color:var(--k-text)}
.drow-l span{font-size:12px;color:var(--k-text-sub)}
.dpill{display:inline-flex;align-items:center;gap:4px;background:var(--k-purple-50);color:var(--k-text-sub);
  font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}

/* 待确认态（need_confirm） */
.task.pending{border-style:dashed;border-color:#F0B429;background:#FFFCF2;box-shadow:0 6px 16px rgba(240,180,41,.16), inset 0 2px 0 rgba(255,255,255,.9)}
.task.pending .give{color:#A16207}
.task.pending .plus{background:#FDF1D2;color:#A16207;box-shadow:none;font-size:12px}

/* 家长鼓励条（孩子端首页） */
.note-bar{display:flex;align-items:center;gap:8px;margin:14px 16px 0;padding:11px 14px;border-radius:16px;
  background:linear-gradient(180deg,#FFF4FA,#FFE9F4);border:1.5px solid #FFD7EC;
  font-size:13px;font-weight:600;color:#B4478F;box-shadow:0 4px 12px rgba(255,133,193,.14)}
.note-bar .ic{flex:0 0 14px}

/* 家长端鼓励输入 */
.noteinput{min-height:56px;border-radius:12px;background:#FBF8FF;border:1px solid #F1E9FB;padding:12px;
  font-size:13px;color:var(--k-text);line-height:1.6}

/* ============ 我的小世界 ============ */
.world{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3);padding:var(--sp-4) var(--sp-4) 88px}
.wcard{height:var(--world-h);background:#fff;border-radius:var(--r-card);border:1.5px solid rgba(255,255,255,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 5px 12px rgba(150,90,205,.10), inset 0 2px 0 rgba(255,255,255,.95);cursor:pointer;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1), box-shadow .16s}
.wcard:active{transform:translateY(2px) scale(.98);box-shadow:var(--clay-card-press)}
.wcard .wi{display:flex;align-items:center;justify-content:center}
.wcard .wt{font-size:var(--fs-note);font-weight:700;color:var(--k-text)}
.wcard .ws{font-size:11px;color:var(--k-text-sub)}
/* ============ 导航 ============ */
.nav{height:var(--nav-h);background:#fff;border-top:1px solid rgba(255,255,255,.9);
  box-shadow:0 -6px 18px rgba(150,90,205,.10);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);position:relative}
.nav::before{content:"";position:absolute;top:-12px;left:0;right:0;height:12px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;
  font-size:var(--nav-label);color:var(--k-text-sub)}
.nav button.on{color:#DB2777;font-weight:700}
.nav svg{width:26px;height:26px;stroke-width:2.3;fill:none;stroke:currentColor}
/* ============ 弹层 ============ */
.sheet{
  position:absolute;inset:0;background:rgba(27,18,48,.45);display:none;align-items:flex-end;z-index:60;
}
.sheet.on{display:flex}
.sheet .panel{width:100%;background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 18px 26px;
  animation:up .3s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:var(--fs-card);color:var(--k-text)}
.sheet p.hint{margin:0 0 14px;font-size:var(--fs-note);color:var(--k-text-sub);line-height:1.5}
.sheet .drop{height:220px;border-radius:var(--r-md);border:2px dashed var(--k-pink);background:var(--k-pink-tint);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:var(--fs-note);
  color:var(--k-text-sub);cursor:pointer;overflow:hidden;position:relative}
.sheet .drop img{width:100%;height:100%;object-fit:contain;background:#fff}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn-l .ic{display:inline-block;vertical-align:-3px;margin-right:6px}
.btn-l{height:var(--tap-primary);border-radius:var(--r-pill);font-size:var(--fs-body);font-weight:700;
  display:flex;align-items:center;justify-content:center}
.btn-primary{background:var(--k-grad-cta);color:#fff;box-shadow:0 6px 18px rgba(219,39,119,.28)}
.btn-ghost{background:#F4EEFB;color:var(--k-text-sub)}
.btn-full{grid-column:1/-1}
/* ============ 选人页 ============ */
.choose{padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;
  background:var(--k-grad-hero)}
.choose h2{font-size:var(--fs-title);color:var(--k-text-strong);margin:0 0 22px;font-weight:700}
.kids{display:flex;gap:16px}
.kidcard{width:140px;padding:18px 10px;border-radius:26px;background:rgba(255,255,255,.96);text-align:center;
  box-shadow:var(--clay-float);cursor:pointer;transition:transform .16s cubic-bezier(.34,1.4,.64,1)}
.kidcard:active{transform:scale(.97)}
.kidcard .ring{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-size:44px;border:4px solid var(--kid-a);background:#fff}
.kidcard.b .ring{border-color:var(--kid-b)}
.kidcard .kn{font-size:var(--fs-card);font-weight:700}
.kidcard .kw{font-size:var(--fs-micro);color:var(--k-text-sub);margin-top:4px}
.choose .mem{margin-top:26px;font-size:var(--fs-micro);color:rgba(46,16,101,.62)}
/* ============ 我的 ============ */
.me-top{padding:24px 16px 18px;display:flex;align-items:center;gap:14px;background:var(--k-grad-hero)}
.me-top .av{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:34px;border:3px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(120,60,160,.2)}
.me-top .mn{font-size:var(--fs-title);font-weight:700;color:var(--k-text-strong)}
.me-top .mb{font-size:var(--fs-note);color:var(--k-text);opacity:.85;margin-top:4px}
.ledger{padding:16px}
.ledger h3{font-size:var(--fs-card);margin:0 0 10px;color:var(--k-text)}
.lrow{height:64px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r-md);
  padding:0 14px;margin-bottom:8px;font-size:var(--fs-note)}
.lrow .li{width:34px;height:34px;border-radius:10px;background:var(--k-purple-50);display:flex;align-items:center;justify-content:center;font-size:16px}
.lrow .ln{flex:1;font-weight:600}
.lrow .lv{font-weight:700}
.lrow .lv.neg{color:var(--k-text-sub)}
.lrow .ld{color:#7E7396;font-size:var(--fs-micro)}
.me-btns{padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
.gear{position:absolute;right:16px;top:16px;width:var(--tap-secondary);height:var(--tap-secondary);border-radius:50%;
  background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 2px 10px rgba(120,60,160,.18)}
/* ============ 商店 + 心愿 ============ */
.wishwrap{padding:16px}
.wish{background:#fff;border-radius:var(--r-card);padding:16px;box-shadow:var(--clay-card);border:1.5px solid rgba(255,255,255,.9);margin-bottom:14px}
.wish .wt{display:flex;align-items:center;gap:10px;font-size:var(--fs-body);font-weight:700}
.wish .wt .wi{width:44px;height:44px;border-radius:12px;background:#FFF6DC;display:flex;align-items:center;justify-content:center;font-size:22px}
.wish .wp{height:12px;border-radius:6px;background:#F0E7FA;margin:12px 0 8px;overflow:hidden}
.wish .wp i{display:block;height:100%;width:85%;border-radius:6px;background:linear-gradient(90deg,#FF85C1,#A855F7)}
.wish .wn{font-size:var(--fs-note);color:var(--k-text-sub);display:flex;justify-content:space-between}
.wish .badge{display:inline-block;margin-top:10px;background:#FFF1F6;color:#DB2777;font-size:var(--fs-micro);
  font-weight:700;padding:6px 10px;border-radius:8px}
.newwish{height:76px;border:2px dashed var(--k-purple-soft);border-radius:var(--r-card);display:flex;align-items:center;
  justify-content:center;gap:8px;color:var(--k-text-sub);font-size:var(--fs-body);font-weight:600;background:rgba(255,255,255,.6)}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 100px}
.tile{background:#fff;border-radius:var(--r-card);height:118px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;border:1.5px solid rgba(255,255,255,.9);box-shadow:var(--clay-card);position:relative;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1), box-shadow .16s}
.tile:active{transform:translateY(2px) scale(.985);box-shadow:var(--clay-card-press)}
.tile .ti{font-size:26px}
.tile .tn{font-size:var(--fs-note);font-weight:600}
.tile .tc{font-size:var(--fs-note);font-weight:700;color:var(--k-gold-text)}
.tile.lack{opacity:.55}
.tile .lk{position:absolute;bottom:8px;font-size:10px;background:#F1F0F5;color:#6B6480;padding:2px 6px;border-radius:6px}
/* 家长端设置行 */
.pset{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 0;border-top:1px solid var(--p-border);font-size:13px}
.pset:first-of-type{border-top:0}
.pset b{font-weight:600;color:var(--p-text)}
.psw{width:44px;height:26px;border-radius:999px;background:#E5E1EE;position:relative;flex:0 0 44px}
.psw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.16);transition:.18s}
.psw.on{background:#7C3AED}
.kv b.psw,.kv .psw{flex:0 0 44px;width:44px;font-size:0;letter-spacing:0}
.psw.on::after{left:21px}

/* 账号行 & 登录页脚 */
.acct{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:700;
  color:var(--k-text-sub);background:#F4EEFB;border-radius:999px;padding:5px 11px}
.acct .ic{width:12px;height:12px}
.pin-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:16px;font-size:12.5px;color:#9A93AC}
.pin-foot button{color:var(--k-text-sub);font-weight:600}

/* 家长查看孩子页：顶部细条 */
.kbar{height:36px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:#1B1230;color:#fff;transition:opacity .4s}
.kbar .kb-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.22)}
.kbar .kb-t{font-size:12px;font-weight:700;letter-spacing:.02em}
.kbar .kb-back{margin-left:auto;font-size:12px;color:#FFD700;font-weight:700}

/* 家长端账号行 */
.kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--p-border);font-size:13px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--p-text-sub)}
.kv b{flex:1;font-weight:700;font-size:15px;letter-spacing:.02em}
.kv b.code{letter-spacing:.14em;font-variant-numeric:tabular-nums}

/* ============ 孩子详情：头图 / 进度条 / 时间线 / 账号弹层 ============ */
.kidhead{margin:0 0 12px;padding:16px;border-radius:16px;
  background:linear-gradient(180deg,#FFF0F7 0%,#F7EEFF 100%);
  border:1px solid #F6E3F0}
.kh-top{display:flex;align-items:center;gap:12px}
.kh-ava{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(150,90,205,.16);border:2px solid #fff;overflow:hidden}
.kh-name{font-size:18px;font-weight:800;color:#2E1065;line-height:1.2}
.kh-meta{font-size:11.5px;color:#6B6480;margin-top:3px}
.kh-star{display:flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:5px 10px;
  font-size:13px;color:#4A2666;box-shadow:0 2px 6px rgba(150,90,205,.12)}
.kh-star b{font-weight:800}
.kh-today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kh-today>div{background:rgba(255,255,255,.85);border-radius:10px;padding:8px 6px;text-align:center;
  display:flex;flex-direction:column;gap:2px}
.kh-today b{font-size:16px;font-weight:800;color:#2E1065;display:flex;align-items:center;justify-content:center}
.kh-today span{font-size:10.5px;color:#6B6480}
.kh-actions{display:flex;gap:8px;margin-top:12px}
.kh-actions .pbtn{flex:1;justify-content:center}

.pbar{height:9px;border-radius:5px;background:#F0EAF8;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#FF85C1,#A855F7)}

.ptl>div{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--p-border);font-size:12.5px}
.ptl>div:first-child{border-top:0}
.ptl i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.ptl .dot-g{background:#22C55E}.ptl .dot-p{background:#FF85C1}.ptl .dot-b{background:#5AA9E6}
.ptl span{flex:1;color:var(--p-text)}
.ptl em{font-style:normal;font-size:11px;color:#9A93AC}

.kv.danger span{color:#B4478F}

/* 家长端底部弹层 */
.psheet{position:absolute;inset:0;background:rgba(27,18,48,.45);display:flex;align-items:flex-end;z-index:80}
.psheet .ppanel{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px 22px;
  animation:up .28s cubic-bezier(.32,.72,0,1);max-height:88%;overflow:auto}
.psheet h3{margin:0 0 4px;font-size:16px;color:var(--p-text)}
.psheet p.sub{margin:0 0 12px;font-size:12px;color:var(--p-text-sub);line-height:1.6}
.psheet .x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;background:#F3F0F8;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#6B6480}

/* 分段控件 / 标签胶囊 */
.seg{display:flex;gap:6px;padding:10px 16px 12px;background:transparent}
.seg button{flex:1;height:34px;border-radius:10px;font-size:12.5px;font-weight:700;color:#7C64A6;
  background:rgba(255,255,255,.7);border:1px solid rgba(168,85,247,.14)}
.seg button.on{background:var(--k-grad-cta);color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(219,39,119,.22)}
.tagpill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;
  background:#F7F1FE;color:#6D3FA0;font-size:12.5px;font-weight:700;border:1px solid rgba(168,85,247,.14)}
.tagpill.add{background:#fff;border-style:dashed;color:#9A93AC}

/* ============ 家长端底部导航 ============ */
.pnav{height:64px;flex:0 0 auto;background:#fff;border-top:1px solid var(--p-border);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.pnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:600;color:#8B84A0}
.pnav button.on{color:var(--p-accent)}
.pnav svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}

/* ============ 家长端：选孩子 / 二维码 / 设备 ============ */
.kidchips{display:flex;gap:10px}
.kchip{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:12px;background:#fff;
  border:1px solid var(--p-border);font-size:13px;font-weight:600;color:var(--p-text)}
.kchip.on{border-color:var(--p-accent);background:var(--p-accent-weak);color:#6D28D9}
.kchip svg{width:22px;height:22px}
.qrwrap{position:relative;display:flex;justify-content:center;padding:10px 0 4px}
.qrwrap svg{border-radius:14px;box-shadow:0 6px 18px rgba(27,18,48,.10)}
.qr-ava{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:12px;
  background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff, 0 2px 8px rgba(27,18,48,.14)}
.qrcode-text{text-align:center;font-size:24px;font-weight:800;letter-spacing:.18em;color:var(--p-text);margin:6px 0 4px}
.pdev{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--p-border);font-size:13px}
.pdev span:first-child{flex:1;font-weight:600}
.pdev .pdev-t{font-size:11.5px;color:var(--p-text-sub)}

/* ============ 孩子端预览条 ============ */
.preview-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#1B1230;color:#fff;flex:0 0 auto}
.preview-bar .pv-tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;background:#FFD700;color:#3A2A00;
  border-radius:6px;padding:2px 6px}
.preview-bar .pv-name{flex:1;font-size:12.5px;opacity:.92}
.preview-bar .pv-back{font-size:12.5px;font-weight:700;color:#FFD700;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.12)}

/* ============ 孩子密码 ============ */

.pinpage{height:100%;background:
    radial-gradient(120% 60% at 15% 0%, #FFE4F1 0%, transparent 55%),
    radial-gradient(110% 70% at 95% 12%, #EDE0FD 0%, transparent 60%), #FBF7FF;
  display:flex;flex-direction:column;align-items:center;padding:38px 24px 22px}
.pin-ava{width:92px;height:92px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--clay-float);border:3px solid #fff}
.pin-name{font-size:20px;font-weight:800;color:var(--k-text-strong);margin-top:12px}
.pin-sub{font-size:14px;color:var(--k-text-sub);margin-top:2px}
.pin-dots{display:flex;gap:14px;margin:24px 0 4px}
.pin-dots i{width:16px;height:16px;border-radius:50%;background:#EADCF7;transition:.2s}
.pin-dots i.on{background:linear-gradient(180deg,#BE97F2,#8E5BE0);transform:scale(1.12);
  box-shadow:0 3px 8px rgba(142,91,224,.35)}
.pin-err{height:18px;font-size:12px;color:#DB2777;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:8px}
.keypad button{height:60px;border-radius:20px;background:#fff;font-size:22px;font-weight:800;color:var(--k-text);
  box-shadow:var(--clay-card);transition:transform .14s cubic-bezier(.34,1.5,.64,1), box-shadow .14s}
.keypad button:active{transform:translateY(2px) scale(.96);box-shadow:var(--clay-card-press)}
.keypad .kp-ghost{font-size:14px;font-weight:700;color:var(--k-text-sub);background:#F7F1FE;box-shadow:none}
.pin-note{margin-top:auto;font-size:12px;color:#7E7396;text-align:center;padding-top:14px}
.kidcard{position:relative}
.klock{display:inline-flex;align-items:center;gap:3px;margin-top:7px;font-size:11px;font-weight:700;
  color:var(--k-text-sub);background:#F4EEFB;border-radius:8px;padding:2px 7px}

/* ============ 家长门 ============ */
.gate{height:100%;background:#fff;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gate h2{font-size:20px;margin:0;color:var(--p-text)}
.gate p{font-size:13px;color:var(--p-text-sub);margin:0 0 18px;text-align:center;line-height:1.6}
.gate .q{font-size:17px;font-weight:700;color:var(--p-text);margin-bottom:16px}
.gate .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.gate .opt{height:80px;border-radius:14px;background:#F7F5FB;border:1px solid #E7E5EE;font-size:22px;font-weight:700;
  color:var(--p-text);display:flex;align-items:center;justify-content:center}
.gate .opt:active{background:#EFE9FA}
.gate .opt.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 家长密码 —— 与孩子端登录页同一套视觉（仅尺寸略小） */
.gate{
  height:100%;position:relative;display:flex;flex-direction:column;align-items:center;
  padding:38px 24px 22px;
  background:
    radial-gradient(120% 60% at 15% 0%, #FFE4F1 0%, transparent 55%),
    radial-gradient(110% 70% at 95% 12%, #EDE0FD 0%, transparent 60%), #FBF7FF;
}
.gate-lock{width:92px;height:92px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  color:#7C3AED;border:3px solid #fff;box-shadow:var(--clay-float)}
.gate h2{font-size:20px;font-weight:800;color:var(--k-text-strong);margin:12px 0 0}
.gate p{font-size:14px;color:var(--k-text-sub);margin:3px 0 0;text-align:center;line-height:1.5}
.gate-dots{display:flex;gap:14px;margin:24px 0 4px}
.gate-dots i{width:16px;height:16px;border-radius:50%;background:#EADCF7;transition:.2s}
.gate-dots i.on{background:linear-gradient(180deg,#BE97F2,#8E5BE0);transform:scale(1.12);
  box-shadow:0 3px 8px rgba(142,91,224,.35)}
.gate .keypad{width:100%;max-width:340px;gap:12px;margin-top:8px}
.gate .keypad button{height:60px;border-radius:20px;background:#fff;color:var(--k-text);
  font-size:22px;font-weight:800;box-shadow:var(--clay-card)}
.gate .keypad button:active{transform:translateY(2px) scale(.96);box-shadow:var(--clay-card-press)}
.gate .keypad .kp-ghost{font-size:14px;font-weight:700;color:var(--k-text-sub);background:#F7F1FE;box-shadow:none}
.gate .pin-err{color:#DB2777}
.gate-foot{margin-top:auto;padding-top:14px;text-align:center}
.gate-foot button{font-size:12.5px;color:var(--k-text-sub);font-weight:700}
.gate .warn{color:#7E7396;font-size:11.5px;margin-top:6px}

/* ============ 家长端 ============ */
.p-app{height:100%;display:flex;flex-direction:column;background:var(--p-bg);font-size:var(--p-fs-body);color:var(--p-text)}
.p-head{padding:16px 16px 12px;background:#fff;border-bottom:1px solid var(--p-border)}
.p-head h1{margin:0;font-size:18px;color:var(--p-text)}
.p-head .d{font-size:12px;color:var(--p-text-sub);margin-top:3px}
.p-body{flex:1;overflow:auto;padding:14px}
.pcard{background:#fff;border:1px solid var(--p-border);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(27,18,48,.05), inset 0 1px 0 rgba(255,255,255,.8)}
.pcard .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pcard .pav{width:38px;height:38px;border-radius:50%;background:var(--p-accent-weak);display:flex;align-items:center;
  justify-content:center;font-size:19px;border:2px solid var(--k-pink)}
.pcard .pnm{font-size:15px;font-weight:700}
.pcard .pmeta{font-size:12px;color:var(--p-text-sub);margin-left:auto}
.prow{display:block;font-size:12.5px;color:var(--p-text-sub);line-height:1.8}
.prow b{color:var(--p-text);font-weight:600}
.pactions{display:flex;gap:8px;margin-top:12px}
.pbtn{height:var(--p-control);border-radius:10px;padding:0 14px;font-size:13px;font-weight:600;
  background:var(--p-accent);color:#fff;display:flex;align-items:center}
.pbtn.ghost{background:#fff;border:1px solid var(--p-border);color:var(--p-text)}
.todo{background:#fff;border:1px solid var(--p-border);border-left:3px solid var(--p-accent);border-radius:10px;
  padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:10px}
.todo span{flex:1}
.warn{font-size:11px;color:#9A93AC;margin:10px 2px 0;line-height:1.6}
/* 小屏适配 */
@media (max-width:1180px){ .notes{display:none} }
@media (max-width:860px){ .rail{display:none} }
/* ============================================================
   统一风格层：孩子端 / 家长端共用同一套视觉语言
   —— 统一：色板、圆角、柔和投影、渐变头图、图标砖、按钮质感
   —— 保留差异：尺寸与信息密度（孩子 72/16px，家长 40/14px）
   ============================================================ */

/* 1) 家长端页面底：与孩子端同一套浅渐变 + 光斑 */
.p-app{
  background:
    radial-gradient(120% 55% at 10% 0%, #FFF0F7 0%, transparent 58%),
    radial-gradient(110% 65% at 98% 14%, #F2EAFF 0%, transparent 62%),
    #FAF7FE;
}

/* 2) 家长端头图：浅渐变 + 深紫字（与孩子端头图同一语言，只是更矮） */
.p-head{
  background:linear-gradient(180deg,#FFE6F2 0%,#EEE1FE 100%);
  border-bottom:0; padding:14px 16px 16px;
  border-radius:0 0 18px 18px;
  box-shadow:0 4px 14px rgba(150,90,205,.08);
}
.p-head h1{color:var(--k-text-strong);font-weight:800;font-size:18px;letter-spacing:.2px}
.p-head .d{color:#7C64A6;font-size:12px}
.p-head button{color:#7C64A6}

/* 3) 卡片：同一套 clay 质感，半径与孩子端对齐到 20，投影更轻 */
.pcard{
  border-radius:20px;border:1.5px solid rgba(255,255,255,.92);
  background:#fff;
  box-shadow:0 8px 18px rgba(150,90,205,.11), 0 2px 5px rgba(150,90,205,.06),
             inset 0 2px 0 rgba(255,255,255,.95);
  padding:14px;
}
.pcard .pnm{color:var(--k-text);font-weight:700;font-size:14px}
.pcard .pmeta{color:#8B7FA8}

/* 4) 按钮：主按钮用与孩子端相同的渐变，次按钮白底柔和 */
.pbtn{
  border-radius:12px;font-weight:700;color:#fff;
  background:var(--k-grad-cta);
  box-shadow:0 4px 12px rgba(219,39,119,.22), inset 0 1.5px 0 rgba(255,255,255,.4);
  transition:transform .14s cubic-bezier(.34,1.5,.64,1), box-shadow .14s;
}
.pbtn:active{transform:translateY(1px) scale(.985);box-shadow:0 2px 6px rgba(219,39,119,.2)}
.pbtn.ghost{
  background:#fff;border:1.5px solid rgba(168,85,247,.16);color:#6D3FA0;
  box-shadow:0 3px 8px rgba(150,90,205,.08), inset 0 1.5px 0 rgba(255,255,255,.9);
}

/* 5) 底部导航：与孩子端同款白底 + 上投影，选中用品牌紫 + 圆点 */
.pnav{
  height:64px;border-top:0;background:#fff;
  box-shadow:0 -6px 18px rgba(150,90,205,.10);
  border-radius:18px 18px 0 0;padding-top:4px;
}
.pnav button{color:#9A93AC;font-weight:700;position:relative}
.pnav button.on{color:#DB2777}
.pnav button.on::after{
  content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
  background:linear-gradient(135deg,#DB2777,#7C3AED);
}
.pnav svg{stroke-width:2.2}

/* 6) 设置行 / 列表行：与孩子端"行卡"同一节奏 */
.kv{padding:11px 0;border-top:1px solid #F3EDFA;font-size:13px}
.kv span{color:#6B6480}
.kv b{color:var(--k-text);font-weight:700}
.kv:first-of-type{border-top:0}
.pdev{border-top:1px solid #F3EDFA}

/* 7) 进度条：与孩子端同款渐变 */
.pbar{height:9px;border-radius:5px;background:#F2EAFB}
.pbar i{background:linear-gradient(90deg,#FF85C1,#A855F7);
  box-shadow:0 1px 4px rgba(168,85,247,.28)}

/* 8) 弹层：与孩子端 sheet 同圆角与动效 */
.psheet .ppanel{border-radius:24px 24px 0 0;
  box-shadow:0 -10px 30px rgba(120,60,170,.18)}

/* 9) 头像框：两端统一白圈 + 主色描边 */
.pcard .pav{border:2px solid #FFD7EC;background:#fff;
  box-shadow:0 3px 8px rgba(150,90,205,.14)}

/* 10) 家长端图标砖（任务配置等）与孩子端同款 */
.ico{box-shadow:0 4px 10px rgba(142,91,224,.26), inset 0 2px 0 rgba(255,255,255,.45)}

/* 11) 字号统一：正文 14 保持一致，标题层级对齐孩子端比例 */
.p-app{font-size:14px;color:var(--k-text)}

/* ============ 说说话 ============ */
.chatwrap{flex:1;display:flex;flex-direction:column;min-height:0;background:
  radial-gradient(120% 50% at 15% 0%, #FFE4F1 0%, transparent 58%),
  radial-gradient(110% 60% at 95% 10%, #EDE0FD 0%, transparent 62%), #FAF6FE}
.chathead{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(180deg,#FFE6F2,#F3E8FE);
  border-radius:0 0 18px 18px}
.ch-ava{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--clay-ico)}
.ch-name{font-size:16px;font-weight:800;color:var(--k-text-strong)}
.ch-sub{font-size:11.5px;color:var(--k-text-sub)}
.chatbody{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.reviewbar{background:#FFF9E6;border:1px solid #FFE9A8;color:#7A5B00;font-size:12px;font-weight:600;
  border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:6px}
.msg{display:flex;align-items:flex-end;gap:7px;max-width:86%}
.msg.kid{align-self:flex-end;flex-direction:row-reverse}
.b-ava{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--clay-ico);flex:0 0 30px}
.b-ava .av-ic{width:26px;height:26px}
.bubble-s{background:#fff;border-radius:16px 16px 16px 6px;padding:11px 13px;font-size:14px;line-height:1.55;
  color:var(--k-text);box-shadow:var(--clay-card)}
.msg.kid .bubble-s{background:var(--k-grad-cta);color:#fff;border-radius:16px 16px 6px 16px;
  box-shadow:0 4px 12px rgba(219,39,119,.24)}
.bubble-s .ic{display:inline-block;vertical-align:-2px}
.typing{display:inline-flex;gap:4px;align-items:center;height:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:#C4A6F5;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:#fff;border:1.5px solid rgba(168,85,247,.16);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:600;color:var(--k-text-sub);box-shadow:0 2px 6px rgba(150,90,205,.08)}
.chatbar{display:flex;align-items:center;gap:10px;padding:10px 14px 14px}
.textbtn{height:56px;padding:0 16px;border-radius:999px;background:#fff;font-size:14px;font-weight:700;
  color:var(--k-text-sub);box-shadow:var(--clay-card)}
.chatbar .mic{flex:1;height:72px;border-radius:999px;background:var(--k-grad-cta);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;
  box-shadow:0 6px 18px rgba(219,39,119,.28), inset 0 2px 0 rgba(255,255,255,.4)}

/* ============ 闯关 ============ */
.subtabs{display:flex;gap:8px;padding:14px 16px 6px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;
  color:var(--k-text-sub);box-shadow:0 2px 6px rgba(150,90,205,.08)}
.subtabs button.on{background:var(--k-grad-cta);color:#fff;box-shadow:0 4px 12px rgba(219,39,119,.24)}
.questgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 96px}
.quest{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--clay-card);
  border:1.5px solid rgba(255,255,255,.9);display:flex;flex-direction:column;gap:6px}
.quest.done{background:var(--k-success-bg)}
.q-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--k-text-sub)}
.quest.done .q-top{color:var(--k-success-text)}
.q-name{font-size:15px;font-weight:800;color:var(--k-text)}
.q-st{font-size:11.5px;color:#7E7396}
.q-btn{height:40px;border-radius:12px;background:#F6EEFF;color:#7C3AED;font-size:13px;font-weight:700;margin-top:4px}
.quest.done .q-btn{background:#E7F8EC;color:var(--k-success-text)}

/* ============ 签到 ============ */
.egggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.egg{aspect-ratio:1/1;border-radius:20px;background:#fff;box-shadow:var(--clay-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:1.5px solid rgba(255,255,255,.9)}
.egg span{font-size:11px;font-weight:700;color:var(--k-text-sub)}

let picked = null;

function checkin(id, ev){
  const t = state.tasks.find(x=>x.id===id);
  if(!t || t.cur>=t.target || t.pending) return;
  /* 需要家长确认：先提交，不发星 */
  if(t.confirm){
    t.pending = true;
    render();
    toast('已经交给爸爸妈妈啦，等他确认');
    return;
  }
  // 必填拍照 → 走拍照弹层
  if(t.required && t.media===0){
    go('photo'); return;
  }
  const el = document.getElementById('task-'+id);
  flyStar(el, ev);
  t.cur++;
  render();
}

function flyStar(el, ev){
  const r = el.getBoundingClientRect();
  const star = document.createElement('div');
  star.className='fly'; star.innerHTML=ico('star',18);
  star.style.left = (r.right-150)+'px'; star.style.top = (r.top+34)+'px';
  document.body.appendChild(star);
  const chest = document.querySelector('.chest');
  const c = chest ? chest.getBoundingClientRect() : r;
  requestAnimationFrame(()=>{
    star.style.transition='transform .7s cubic-bezier(.4,0,.2,1), opacity .7s';
    star.style.transform = `translate(${(c.left+40)-(r.right-150)}px, ${(c.top+20)-(r.top+34)}px) scale(.7) rotate(180deg)`;
    star.style.opacity='.2';
  });
  setTimeout(()=>star.remove(), 760);
}

function pickPhoto(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  picked = url;
  const drop = document.getElementById('drop');
  drop.innerHTML = `<img src="${url}" alt="preview">`;
}

function confirmPhoto(){
  const t = state.tasks.find(x=>x.required && x.media===0);
  if(t){ t.cur = Math.min(t.target, t.cur+1); t.media = 1; }
  render();
}

/* 二维码（原型用确定性方块矩阵模拟，非真实可扫） */
function qrSvg(text){
  const N = 21;
  let h = 2166136261;
  for (const ch of String(text)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const inFinder = (x,y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  const cells = [];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (inFinder(x,y)) continue;
      if (rnd() > 0.52) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
    }
  }
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.8" fill="none" stroke="#1B1230" stroke-width="1"/>
    <rect x="${x+2}" y="${y+2}" width="3" height="3" rx="0.7"/>`;
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" width="168" height="168" aria-label="配对二维码">
    <rect x="-1" y="-1" width="${N+2}" height="${N+2}" rx="2" fill="#fff"/>
    <g fill="#1B1230">${cells.join('')}</g>
    ${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}
  </svg>`;
}

/* 家长确认 & 鼓励 */
function toggleSendKid(el){
  el.classList.toggle('on');
  /* "两个都发" 是快捷方式，手动改选后取消它 */
  const all = el.parentElement.querySelectorAll('.kchip');
  const allBtn = [...all].find(b => b.textContent.includes('两个都发'));
  if (allBtn && !el.textContent.includes('两个都发')) allBtn.classList.remove('on');
}
function toggleSendAll(el){
  const on = !el.classList.contains('on');
  el.parentElement.querySelectorAll('.kchip').forEach(b => b.classList.toggle('on', on));
}

function approveConfirm(id, ok){
  const t = state.tasks.find(x => x.id === id);
  if(!t) return;
  if(ok){ t.pending = false; t.cur = Math.min(t.target, t.cur + 1); }
  else { t.pending = false; }
  render();
  toast(ok ? '已确认，星星发给她了' : '已退回，让她再做一次');
}
function sendNote(){
  const el = document.querySelector('.noteinput');
  state.parentNote = (el && el.textContent.trim()) || '';
  render();
  toast('鼓励已发给孩子');
}

/* 孩子端 · 自己设置密码（两步确认） */
let setBuf = '', setFirst = '', setStage = 1;
function setStart(){ setBuf=''; setFirst=''; setStage=1; go('pinset'); }
function setKey(k){
  const err = () => document.getElementById('setErr');
  if(k === 'del'){ setBuf = setBuf.slice(0,-1); setPaint(); return; }
  if(setBuf.length >= 4) return;
  setBuf += k; setPaint();
  if(setBuf.length === 4){
    if(setStage === 1){
      setFirst = setBuf; setBuf = ''; setStage = 2;
      setTimeout(() => {
        setPaint();
        if(err()) err().textContent = '再输一次，确认一下';
        const sub = document.querySelector('.pin-sub'); if(sub) sub.textContent = '再输一次';
      }, 160);
    } else {
      if(setBuf === setFirst){
        if(err()) err().textContent = '设好啦，记住哦';
        setTimeout(() => { setBuf=''; setFirst=''; setStage=1; go('me'); }, 700);
      } else {
        setBuf=''; setFirst=''; setStage=1;
        setTimeout(() => {
          setPaint();
          if(err()) err().textContent = '两次不一样，再来一次';
          const sub = document.querySelector('.pin-sub'); if(sub) sub.textContent = '只有你知道的 4 个数字';
        }, 160);
      }
    }
  }
}
function setPaint(){
  document.querySelectorAll('#setDots i').forEach((el,i) => el.classList.toggle('on', i < setBuf.length));
}

/* 家长密码 */
let gateBuf = '', gateTries = 0;
const GATE_CODE = '123456';
function gateKey(k){
  const err = () => document.getElementById('gateErr');
  if(k === 'del'){ gateBuf = gateBuf.slice(0,-1); gatePaint(); return; }
  if(gateBuf.length >= 6) return;
  gateBuf += k; gatePaint();
  if(gateBuf.length === 6){
    if(gateBuf === GATE_CODE){
      if(err()) err().textContent = '欢迎回来';
      setTimeout(() => { gateBuf=''; gateTries=0; go('parent'); }, 200);
    } else {
      gateBuf=''; gateTries++;
      setTimeout(() => {
        gatePaint();
        if(gateTries >= 5){ go('me'); return; }
        if(err()) err().textContent = gateTries >= 3 ? ('再试一次，或者用手机号重置（还可试 ' + (5-gateTries) + ' 次）') : '密码不对，再试一次';
      }, 150);
    }
  }
}
function gatePaint(){
  document.querySelectorAll('#gateDots i').forEach((el,i) => el.classList.toggle('on', i < gateBuf.length));
}

/* 孩子密码 */
let pinBuf = '', pinTries = 0, pinCooling = false;
const PIN_CODE = '1234';
function pinStart(){
  pinBuf = ''; pinTries = 0; pinCooling = false;
  go('pin');
}
function pinKey(k){
  if(pinCooling) return;
  const err = () => document.getElementById('pinErr');
  if(k === 'del'){ pinBuf = pinBuf.slice(0,-1); pinPaint(); return; }
  if(pinBuf.length >= 4) return;
  pinBuf += k; pinPaint();
  if(pinBuf.length === 4){
    if(pinBuf === PIN_CODE){
      if(err()) err().textContent = '好的，进去吧';
      setTimeout(() => { pinBuf = ''; go('home'); }, 220);
    } else {
      pinTries++; pinBuf = '';
      setTimeout(() => {
        pinPaint();
        if(pinTries >= 3){
          pinCooling = true;
          if(err()) err().textContent = '试了 3 次啦，叫爸爸妈妈帮你吧';
          setTimeout(() => { pinCooling = false; pinTries = 0; if(err()) err().textContent = ''; }, 3000);
        } else if(err()) err().textContent = '再想一想哦';
      }, 160);
    }
  }
}
function pinPaint(){
  document.querySelectorAll('#pinDots i').forEach((el,i) => el.classList.toggle('on', i < pinBuf.length));
}
function pinHelp(){ go('gate'); }

function toast(msg){
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(27,18,48,.9);color:#fff;font-size:12.5px;padding:10px 14px;border-radius:12px;z-index:200;max-width:78%;text-align:center;line-height:1.5';
  document.getElementById('screen').appendChild(d);
  setTimeout(()=>d.remove(), 2200);
}

function closeSheet(id){ const s=document.getElementById(id); if(s) s.classList.remove('on'); }

/* =========================================================
   路由 / 渲染
   ========================================================= */
let current = 'choose';
function render(){ go(current); }
function go(name){
  const rq = document.getElementById('railq');
  if (rq && rq.value) { rq.value = ''; rq.dispatchEvent(new Event('input')); }
  current = SCREENS[name] ? name : 'home';
  name = current;
  const s = SCREENS[name] || SCREENS.home;
  document.querySelectorAll('.rail button[data-s]').forEach(b=>b.classList.toggle('on', b.dataset.s===name));
  const screen = document.getElementById('screen');
  document.querySelector('.phone').classList.toggle('wide', !!s.wide);
  screen.innerHTML = s.render();
  const bd = screen.querySelector(".body"); if (bd) bd.scrollTop = 0;
  const cb = screen.querySelector(".chatbody"); if (cb) cb.scrollTop = cb.scrollHeight;
  document.getElementById('notes').innerHTML = `
    <h2>${s.title}</h2>
    <div style="margin-bottom:10px">
      <span class="tag">孩子端 72/56px</span><span class="tag">正文 16px</span><span class="tag">家长端 40px</span>
    </div>
    ${s.notes.map(([k,v])=>`<h3>${k}</h3><div>${v}</div>`).join('')}
    <h3>可交互</h3>
    <div>点任务行 +1 · 点相机徽标走拍照 · 点齿轮进家长门（答「七」）</div>`;
}

/* 兜底：屏幕内没有绑定 onclick 的按钮，点击给出明确反馈（原型未接） */
document.getElementById('screen').addEventListener('click', (e) => {

  const label = (btn.textContent || '').trim().slice(0, 12) || '这个按钮';

document.querySelectorAll('.envsw button').forEach(b=>{

/* ---------- 侧栏：折叠 + 搜索 ---------- */
(() => {
  document.querySelectorAll('.rail .grp').forEach(g => {
    const cnt = g.querySelector('.cnt');
    if (cnt) g.dataset.total = cnt.textContent.trim();
    const btns = [];
    let n = g.nextElementSibling;
    while (n && !n.classList.contains('grp')) {
      if (n.matches && n.matches('button[data-s]')) btns.push(n);
      n = n.nextElementSibling;
    }
    g._btns = btns;
    if (cnt) { g.dataset.total = btns.length; cnt.textContent = btns.length; }
    g.addEventListener('click', () => {
      const closed = g.classList.toggle('closed');
      btns.forEach(b => b.classList.toggle('hidden', closed));
    });
  });

  const q = document.getElementById('railq');
  if (q) q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    document.querySelectorAll('.rail .grp').forEach(g => {
      let shown = 0;
      (g._btns || []).forEach(b => {
        const hit = !v || b.textContent.toLowerCase().includes(v);
        b.classList.toggle('hidden', !hit);
        if (hit) shown++;
      });
      g.style.display = (!v || shown) ? '' : 'none';
      if (v) g.classList.remove('closed');
      const cnt = g.querySelector('.cnt');
      if (cnt) cnt.textContent = v ? shown : (g.dataset.total || '');
    });
  });
})();

document.querySelectorAll('.rail button[data-s]').forEach(b=>{
  b.onclick = ()=>go(b.dataset.s);
});

go('choose');
</script>
