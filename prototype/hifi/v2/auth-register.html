<html lang="zh-CN">

<body><div class="phone"><div class="screen  ">

      <div class="authcard">

        <button class="authbtn">注册并继续</button>
        <div class="authlinks"><button>已有账号，去登录</button></div>
      </div>

    </div></main>

</div></div><script src="./hf.js"></script></body></html>
