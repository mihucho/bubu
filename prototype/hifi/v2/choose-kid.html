<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 选人页</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen  ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
    <main class="scroll"><div class="scroll" style="display:flex;flex-direction:column;justify-content:center;padding:0 24px;text-align:center">
      <div style="font-size:22.0px;font-weight:800;color:#2b1147;margin-bottom:18px">你要找谁呀？</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="task" style="flex-direction:column;height:auto;padding:18px;gap:8px">
          <div class="task__tile" style="background:linear-gradient(160deg,#ffe0ef,#ffc6e2)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg></div>
          <div class="task__name" style="font-size:15.0px">小月亮</div>
          <div class="kline__s">今天 1 / 3</div>
        </div>
        <div class="task" style="flex-direction:column;height:auto;padding:18px;gap:8px">
          <div class="task__tile" style="background:linear-gradient(160deg,#e6f0ff,#cfe0ff)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></div>
          <div class="task__name" style="font-size:15.0px">小米粒</div>
          <div class="kline__s">今天 0 / 1</div>
        </div>
      </div>
      <div style="margin-top:18px;font-size:12.0px;color:#7d7395">设备会记住上次选择，下次直达</div>
    </div></main>

</div></div><script src="./hf.js"></script></body></html>
