<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 星星商店</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
<div class="dbar">
        <button class="dbar__back" aria-label="返回">
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div><h1 class="dbar__title">星星商店</h1><p class="dbar__sub">29 颗可用</p></div>
    </div>
    <div class="scroll">      

      <div class="section" style="margin-top:4px"><h2 class="section__title">买得起的</h2><span class="section__count">3 个</span></div>
      <div class="goods">
        <div class="good">
          <div class="good__pic" style="background:linear-gradient(160deg,#ffe9f5,#ffd1e8)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#be185d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></div>
          <div class="good__name">贴纸一张</div>
          <div class="good__row"><svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="good__price">8</span><span class="good__lock">换 →</span></div>
        </div>
        <div class="good">
          <div class="good__pic" style="background:linear-gradient(160deg,#e6f0ff,#cfe2ff)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.6" width="18" height="13" rx="3.2"/><path d="M4.6 8.2l7.4 5.3 7.4-5.3"/></svg></div>
          <div class="good__name">给妈妈写信</div>
          <div class="good__row"><svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="good__price">12</span><span class="good__lock">换 →</span></div>
        </div>
        <div class="good">
          <div class="good__pic" style="background:linear-gradient(160deg,#ddf7e6,#c4f0d5)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/></svg></div>
          <div class="good__name">小黄油零食</div>
          <div class="good__row"><svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="good__price">20</span><span class="good__lock">换 →</span></div>
        </div>
      </div>

      <div class="section" style="margin-top:16px"><h2 class="section__title">还要再攒攒</h2><span class="section__count">2 个</span></div>
      <div class="goods">
        <div class="good" style="opacity:.72">
          <div class="good__pic" style="background:linear-gradient(160deg,#fff0d6,#ffe0ab)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v11H4z"/><path d="M4 13h16M12 9v11"/><path d="M12 9c-1.6 0-4-.6-4-2.4C8 5 10 4.7 11 6c.7 1 1 3 1 3zm0 0c1.6 0 4-.6 4-2.4 0-1.6-2-1.9-3-.6-.7 1-1 3-1 3z"/></svg></div>
          <div class="good__name">周末多玩 1 小时</div>
          <div class="good__row"><svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="good__price">60</span><span class="good__lock">还差 31</span></div>
        </div>
        <div class="good" style="opacity:.72">
          <div class="good__pic" style="background:linear-gradient(160deg,#f0e6ff,#e0d0ff)"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></div>
          <div class="good__name">挑一个徽章</div>
          <div class="good__row"><svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="good__price">45</span><span class="good__lock">还差 16</span></div>
        </div>
      </div>
      <div class="kfoot"></div>
    </div>

    
    <nav class="nav" aria-label="主导航">
      <button class="nav__item nav__item--on" aria-current="page"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>首页</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v17H6a2 2 0 0 1-2-2zM13 3.5h5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-5z"/></svg>阅读</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8M6 20l3.5-6.5L12 15l3.5-6.5L19 15"/></svg>动起来</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8c0 4.3-3.8 7.7-8.5 7.7-1 0-2-.2-2.9-.5L4 20.5l1.4-4.2c-1-1.3-1.5-2.9-1.5-4.5C3.9 7.5 7.7 4 12.4 4s8.1 3.5 8.1 7.8z"/></svg>说说话</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.9a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script></body></html>
