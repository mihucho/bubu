<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 记一次阅读</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen  ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
    <div class="screen-sheet-bg">
      <div class="scroll" style="opacity:.42;pointer-events:none" aria-hidden="true">
        <div class="greet"><div class="avatar"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.6c0-.9.7-1.6 1.6-1.6H11v16H5.6c-.9 0-1.6-.7-1.6-1.6z"/><path d="M13 4h5.4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H13z"/></svg></div><div class="greet__text"><h1 class="greet__name">阅读</h1><p class="greet__meta">这个月读了 8 本 · 共 260 分钟</p></div></div>
        <div class="pcard2" style="margin:12px 16px 0">
          <div class="kv"><span>今天</span><b>还没记</b></div>
          <div class="kv"><span>这周累计</span><b>85 分钟</b></div>
          <div class="kv"><span>连续天数</span><b>4 天</b></div>
        </div>
      </div>
      <div class="sheetpanel " role="dialog" aria-modal="true" aria-labelledby="sht">
        <div class="sheetpanel__grab"></div>
        <h2 class="sheetpanel__t" id="sht">记一次阅读</h2>
        <p style="margin:-4px 0 6px;font-size:13px;color:var(--k-text-sub)">读到就好，不用读完</p>

        <div class="srow">
          <span class="srow__k">读了多少分钟</span>
          <div class="srow__v">
            <div class="kdstep">
              <button class="kdstep__btn" aria-label="减少分钟"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
              <span class="kdstep__v">20<small>分钟</small></span>
              <button class="kdstep__btn" aria-label="增加分钟"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
            </div>
          </div>
        </div>

        <div class="srow">
          <span class="srow__k">书名</span>
          <div class="srow__v"><div class="srow__in">小猪变形记</div></div>
        </div>

        <div class="sheetpanel__btns" style="margin-top:18px">
          <button class="kbtn kbtn--ghost">取消</button>
          <button class="kbtn">记下来</button>
        </div>
      </div>
    </div>

</div></div><script src="./hf.js"></script></body></html>
