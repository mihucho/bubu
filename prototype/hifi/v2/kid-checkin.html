<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 签到彩蛋</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
<div class="dbar">
        <button class="dbar__back" aria-label="返回">
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div><h1 class="dbar__title">签到彩蛋</h1><p class="dbar__sub">今天已经签到 2 天</p></div>
    </div>
    <div class="scroll">      

      <div class="eggcard">
        <div class="eggcard__art">
          <svg viewBox="0 0 24 24" width="46" height="46" fill="#FFF6DC" stroke="#E8B23A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/><path d="M9.4 13.6c.7.9 1.6 1.4 2.6 1.4s1.9-.5 2.6-1.4"/></svg>
        </div>
        <div class="eggcard__t">今天已经签到啦</div>
        <div class="eggcard__s">明天再来，连续 3 天可以开一个彩蛋</div>
      </div>

      <div class="section"><h2 class="section__title">今天的心情</h2><span class="section__count">选一个就好</span></div>
      <div class="moodrow">
        <button class="mood mood--on">
          <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><circle cx="9" cy="10.2" r="1.05" fill="#db2777" stroke="none"/><circle cx="15" cy="10.2" r="1.05" fill="#db2777" stroke="none"/><path d="M8.4 14.2a4.4 4.4 0 0 0 7.2 0"/></svg>
          开心
        </button>
        <button class="mood">
          <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#7c4fb0" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><circle cx="9" cy="10.2" r="1.05" fill="#7c4fb0" stroke="none"/><circle cx="15" cy="10.2" r="1.05" fill="#7c4fb0" stroke="none"/><path d="M8.6 14.4h6.8"/></svg>
          一般
        </button>
        <button class="mood">
          <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#7c4fb0" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><circle cx="9" cy="10.2" r="1.05" fill="#7c4fb0" stroke="none"/><circle cx="15" cy="10.2" r="1.05" fill="#7c4fb0" stroke="none"/><path d="M8.6 15.2a4.4 4.4 0 0 1 6.8 0"/></svg>
          有点累
        </button>
        <button class="mood">
          <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#7c4fb0" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><circle cx="9" cy="10.2" r="1.05" fill="#7c4fb0" stroke="none"/><circle cx="15" cy="10.2" r="1.05" fill="#7c4fb0" stroke="none"/><path d="M8.6 16a4.4 4.4 0 0 1 6.8 0"/></svg>
          难过
        </button>
      </div>

      <div class="section" style="margin-top:16px"><h2 class="section__title">想写一句吗</h2><span class="section__count">可以不写</span></div>
      <div class="klines">
        <div class="kline">
          <span class="kline__ico" style="background:linear-gradient(160deg,#ffe6f4,#ffcfe6)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l9-9 3 3-9 9H5z"/><path d="M14 5l5 5"/></svg></span>
          <div><div class="kline__t">今天的小日记</div><div class="kline__s">今天数学考了 100 分</div></div>
          <span class="kline__v">改 ›</span>
        </div>
      </div>

      <div class="kfoot"><button class="kbtn">记录今天的心情</button></div>
    </div>

    
    <nav class="nav" aria-label="主导航">
      <button class="nav__item nav__item--on" aria-current="page"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>首页</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v17H6a2 2 0 0 1-2-2zM13 3.5h5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-5z"/></svg>阅读</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8M6 20l3.5-6.5L12 15l3.5-6.5L19 15"/></svg>动起来</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8c0 4.3-3.8 7.7-8.5 7.7-1 0-2-.2-2.9-.5L4 20.5l1.4-4.2c-1-1.3-1.5-2.9-1.5-4.5C3.9 7.5 7.7 4 12.4 4s8.1 3.5 8.1 7.8z"/></svg>说说话</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.9a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script></body></html>
