<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 欢迎来到布布</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
    <main class="scroll"><div class="scroll" style="display:flex;flex-direction:column">
      <div class="gsteps"><span class="gdot gdot--done"></span><span class="gdot gdot--done"></span><span class="gdot"></span><span class="gdot"></span><span class="gdot"></span><span class="gdot"></span><span class="gdot"></span><span class="gdot"></span></div>

        <h1 style="margin:6px 0 4px;font-size:19px;font-weight:800;color:#2b1147">欢迎来到布布</h1>

        <div class="pcard2"><div class="obs" style="border:0;background:none;padding:0"><div class="obs__row"><span class="obs__dot"></span><span>每个孩子有自己的账号和密码</span></div><div class="obs__row"><span class="obs__dot"></span><span>家长可以定义所有规则与奖励</span></div><div class="obs__row"><span class="obs__dot"></span><span>孩子之间不做比较</span></div></div></div>
      </div>
      <div style="margin-top:auto;padding:16px 24px">
        <button class="kbtn">开始第一步</button>
        <button class="gstep-back">上一步</button>
      </div>
    </div></main>

</div></div><script src="./hf.js"></script></body></html>
