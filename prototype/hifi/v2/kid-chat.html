<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 说说话</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>

    <div class="chatwrap">
      <header class="chathead">
        <div class="chathead__ava"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z"/><circle cx="10" cy="13.4" r="1" fill="#a855f7" stroke="none"/><circle cx="14" cy="13.4" r="1" fill="#a855f7" stroke="none"/><path d="M10.6 16.2c.9.6 1.9.6 2.8 0"/></svg></div>
        <div>
          <div class="chathead__name">布布</div>
          <div class="chathead__sub">小月亮的好朋友</div>
        </div>
      </header>

      <div class="chatbody">
        <div class="reviewbar">
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
          今天你读了 20 分钟，还差 2 个任务就开宝箱
        </div>

        <div class="cmsg cmsg--bub">
          <span class="cmsg__ava"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z"/><circle cx="10" cy="13.4" r="1" fill="#a855f7" stroke="none"/><circle cx="14" cy="13.4" r="1" fill="#a855f7" stroke="none"/><path d="M10.6 16.2c.9.6 1.9.6 2.8 0"/></svg></span>
          <div class="cbubble">小月亮，今天想聊什么呀？</div>
        </div>
        <div class="cmsg cmsg--kid"><div class="cbubble">我今天表现怎么样</div></div>
        <div class="cmsg cmsg--bub">
          <span class="cmsg__ava"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z"/><circle cx="10" cy="13.4" r="1" fill="#a855f7" stroke="none"/><circle cx="14" cy="13.4" r="1" fill="#a855f7" stroke="none"/><path d="M10.6 16.2c.9.6 1.9.6 2.8 0"/></svg></span>
          <div class="cbubble">你完成了 2 个任务，读了 20 分钟书，还写了心情，今天很稳哦</div>
        </div>
        <div class="cmsg cmsg--kid"><div class="cbubble">那我明天要做什么</div></div>
        <div class="cmsg cmsg--bub">
          <span class="cmsg__ava"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z"/><circle cx="10" cy="13.4" r="1" fill="#a855f7" stroke="none"/><circle cx="14" cy="13.4" r="1" fill="#a855f7" stroke="none"/><path d="M10.6 16.2c.9.6 1.9.6 2.8 0"/></svg></span>
          <div class="cbubble">明天有 3 个任务：阅读、口算、跳绳。先做哪个都行，你定就好</div>
        </div>
      </div>

      <div class="quickchips">
        <button class="quickchip">我今天表现怎么样</button>
        <button class="quickchip">陪我复盘</button>
        <button class="quickchip">我想许个愿</button>
        <button class="quickchip">夸夸我</button>
      </div>

      <div class="chatinput">
        <div class="chatinput__box">想说什么就打在这里…</div>
        <button class="chatinput__send" aria-label="发送">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5 10-11"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>首页</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v17H6a2 2 0 0 1-2-2z"/><path d="M13 3.5h5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-5z"/></svg>阅读</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.4"/><path d="M6 20l3.5-6.5L12 15l3.5-6.5L19 15"/></svg>动起来</button>
      <button class="nav__item nav__item--on" aria-current="page""><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8c0 4.3-3.8 7.7-8.5 7.7-1 0-2-.2-2.9-.5L4 20.5l1.4-4.2c-1-1.3-1.5-2.9-1.5-4.5C3.9 7.5 7.7 4 12.4 4s8.1 3.5 8.1 7.8z"/></svg>说说话</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script>
</body></html>
