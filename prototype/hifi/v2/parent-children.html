<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 孩子</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>

    <header class="p2head">
      <div><h1 class="p2head__t">孩子</h1><p class="p2head__s">2 个 · 最多可以加 6 个</p></div>
      <button class="p2head__act">添加孩子</button>
    </header>

    <div class="pbody">
      <section class="kidcard2">
        <div class="kidcard2__head">
          <span class="kidcard2__ava kidcard2__ava--a"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z"/><circle cx="10" cy="13.4" r=".9" fill="#c026d3" stroke="none"/><circle cx="14" cy="13.4" r=".9" fill="#c026d3" stroke="none"/></svg></span>
          <div><h2 class="kidcard2__name">小月亮</h2><p class="kidcard2__meta">8 岁 · 账号 BUBU7K2M9X · 已开通</p></div>
          <div class="kidcard2__right"><div class="kidcard2__num">29</div><div class="kidcard2__unit">可用星星</div></div>
        </div>
        <div class="stats2">
          <div class="stat2"><div class="stat2__k">任务</div><div class="stat2__v">6<small>个</small></div></div>
          <div class="stat2"><div class="stat2__k">本周达标</div><div class="stat2__v">5<small>天</small></div></div>
          <div class="stat2"><div class="stat2__k">心愿</div><div class="stat2__v">2<small>个</small></div></div>
        </div>
        <div class="kidcard2__foot">
          <button class="pbtn2">打开孩子端</button>
          <button class="pbtn2 pbtn2--ghost">编辑资料</button>
          <button class="pbtn2 pbtn2--ghost">复制配置</button>
        </div>
      </section>

      <section class="kidcard2">
        <div class="kidcard2__head">
          <span class="kidcard2__ava kidcard2__ava--b"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 9.4 6.2 5.6l3.2 1.6"/><path d="M16.8 9.4l1-3.8-3.2 1.6"/><circle cx="12" cy="13.2" r="5.6"/><circle cx="10" cy="12.4" r=".8" fill="#2563eb" stroke="none"/><circle cx="14" cy="12.4" r=".8" fill="#2563eb" stroke="none"/><path d="M11 15.2h2"/></svg></span>
          <div><h2 class="kidcard2__name">小米粒</h2><p class="kidcard2__meta">5 岁 · 还没开通账号</p></div>
          <div class="kidcard2__right"><div class="kidcard2__num">12</div><div class="kidcard2__unit">可用星星</div></div>
        </div>
        <div class="stats2">
          <div class="stat2"><div class="stat2__k">任务</div><div class="stat2__v">2<small>个</small></div></div>
          <div class="stat2"><div class="stat2__k">本周达标</div><div class="stat2__v">2<small>天</small></div></div>
          <div class="stat2"><div class="stat2__k">心愿</div><div class="stat2__v">1<small>个</small></div></div>
        </div>
        <div class="kidcard2__foot">
          <button class="pbtn2">开通账号</button>
          <button class="pbtn2 pbtn2--ghost">编辑资料</button>
        </div>
      </section>

      <div class="pcard2" style="margin-top:2px;display:flex;align-items:center;gap:9px">
        <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#6b6480" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10.5" r="2.2"/><path d="M3.5 19c.5-2.8 2.7-4.3 5.5-4.3s5 1.5 5.5 4.3"/></svg>
        <span style="font-size:12.0px;font-weight:600;color:#3b3350">把另一个家长也拉进来</span>
        <button class="todo2__btn todo2__btn--ghost" style="margin-left:auto">邀请码</button>
      </div>
    </div>
    <nav class="pnav2" aria-label="家长端主导航">
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>概览</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 5v14h14V5M8.5 9.5h7M8.5 13h4.5"/></svg>任务</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg>心愿</button>
      <button class="pnav2__item pnav2__item--on" aria-current="page"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6M16.5 8.3a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4M3.5 19c.5-2.8 2.7-4.3 5.5-4.3s5 1.5 5.5 4.3M15 14.6c2.2 0 4 1.2 4.5 3.4"/></svg>孩子</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.1a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script>
</body></html>
