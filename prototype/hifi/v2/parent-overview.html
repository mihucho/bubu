<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 家长端概览（高保真 v2）</title>
<link rel="stylesheet" href="./hf.css">
</head>
<body>

<div class="phone">
  <div class="screen screen--parent">

    <div class="statusbar">
      <span>9:41</span>
      <span class="statusbar__right">
        <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg>
        <span class="statusbar__bar"></span>
      </span>
    </div>

    <header class="phead2">
      <div class="phead2__top">
        <div class="phead2__greet">
          <h1 class="phead2__name">晚上好</h1>
          <p class="phead2__date">3 月 12 日 · 星期四 · 两个孩子都在</p>
        </div>
        <div class="phead2__icons">
          <button class="pico" aria-label="搜索">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M19.6 19.6l-3.4-3.4"/></svg>
          </button>
          <button class="pico" aria-label="通知，2 条待处理">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.6" width="18" height="13" rx="3.2"/><path d="M4.6 8.2l7.4 5.3 7.4-5.3"/></svg>
            <span class="pico__dot"></span>
          </button>
        </div>
      </div>

      <div class="pstrip">
        <span class="pstrip__ico">
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4.4M12 16.2v.2"/><circle cx="12" cy="12" r="8.6"/></svg>
        </span>
        <span class="pstrip__text">今天有 <b>2 件事</b>等你处理</span>
        <button class="pstrip__go">去处理
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="seg2" role="tablist" aria-label="查看范围">
        <button class="seg2__item seg2__item--on" role="tab" aria-selected="true">全部孩子</button>
        <button class="seg2__item" role="tab" aria-selected="false">小月亮</button>
        <button class="seg2__item" role="tab" aria-selected="false">小米粒</button>
      </div>
    </header>

    <div class="pbody">

      <div class="askcard">
        <span class="askcard__ico">
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8c0 4.3-3.8 7.7-8.5 7.7-1 0-2-.2-2.9-.5L4 20.5l1.4-4.2c-1-1.3-1.5-2.9-1.5-4.5C3.9 7.5 7.7 4 12.4 4s8.1 3.5 8.1 7.8z"/></svg>
        </span>
        <div>
          <div class="askcard__t">问布布</div>
          <div class="askcard__s">这周两个孩子各做了什么 · 还能问 18 次</div>
        </div>
        <svg class="i--sm askcard__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>

      <!-- 待我处理 -->
      <section class="pcard2">
        <div class="pcard2__head">
          <h2 class="pcard2__title">等你处理</h2>
          <span class="pcard2__meta">2 件</span>
        </div>

        <div class="todo2">
          <span class="todo2__ico todo2__ico--warn">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5v5M12 16.8v.2"/><circle cx="12" cy="12" r="8.5"/></svg>
          </span>
          <span class="todo2__text">小月亮交了「学校作业」，等你确认</span>
          <button class="todo2__btn">去确认</button>
        </div>

        <div class="todo2">
          <span class="todo2__ico todo2__ico--pink">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg>
          </span>
          <span class="todo2__text">小米粒想「去动物园」，还没定价</span>
          <button class="todo2__btn todo2__btn--ghost">去定价</button>
        </div>
      </section>

      <!-- 孩子一 -->
      <section class="kidcard2">
        <div class="kidcard2__head">
          <span class="kidcard2__ava kidcard2__ava--a">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z"/><circle cx="10" cy="13.4" r=".9" fill="#c026d3" stroke="none"/><circle cx="14" cy="13.4" r=".9" fill="#c026d3" stroke="none"/></svg>
          </span>
          <div>
            <h2 class="kidcard2__name">小月亮</h2>
            <p class="kidcard2__meta">今天 2 个任务完成 · 1 张照片</p>
          </div>
          <div class="kidcard2__right">
            <div class="kidcard2__num">29</div>
            <div class="kidcard2__unit">可用星星</div>
          </div>
        </div>

        <div class="stats2">
          <div class="stat2">
            <div class="stat2__k">今日任务</div>
            <div class="stat2__v">2 <small>/ 3</small></div>
          </div>
          <div class="stat2">
            <div class="stat2__k">阅读</div>
            <div class="stat2__v">20 <small>分钟</small></div>
          </div>
          <div class="stat2">
            <div class="stat2__k">本周达标</div>
            <div class="stat2__v">5 <small>天</small></div>
          </div>
        </div>

        <div class="kidcard2__foot">
          <button class="pbtn2">看报告</button>
          <button class="pbtn2 pbtn2--ghost">去配置</button>
        </div>
      </section>

      <!-- 孩子二 -->
      <section class="kidcard2">
        <div class="kidcard2__head">
          <span class="kidcard2__ava kidcard2__ava--b">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7.2 9.4 6.2 5.6l3.2 1.6"/><path d="M16.8 9.4l1-3.8-3.2 1.6"/>
              <circle cx="12" cy="13.2" r="5.6"/>
              <circle cx="10" cy="12.4" r=".8" fill="#2563eb" stroke="none"/>
              <circle cx="14" cy="12.4" r=".8" fill="#2563eb" stroke="none"/>
              <path d="M11 15.2h2"/>
            </svg>
          </span>
          <div>
            <h2 class="kidcard2__name">小米粒</h2>
            <p class="kidcard2__meta">今天 1 个任务完成 · 还没有阅读</p>
          </div>
          <div class="kidcard2__right">
            <div class="kidcard2__num">12</div>
            <div class="kidcard2__unit">可用星星</div>
          </div>
        </div>

        <div class="stats2">
          <div class="stat2">
            <div class="stat2__k">今日任务</div>
            <div class="stat2__v">1 <small>/ 2</small></div>
          </div>
          <div class="stat2">
            <div class="stat2__k">阅读</div>
            <div class="stat2__v">0 <small>分钟</small></div>
          </div>
          <div class="stat2">
            <div class="stat2__k">本周达标</div>
            <div class="stat2__v">2 <small>天</small></div>
          </div>
        </div>

        <div class="kidcard2__foot">
          <button class="pbtn2">看报告</button>
          <button class="pbtn2 pbtn2--ghost">提醒一下</button>
        </div>
      </section>

      <!-- 快捷 -->
      <section class="pcard2">
        <div class="pcard2__head">
          <h2 class="pcard2__title">快捷入口</h2>
        </div>
        <div class="todo2">
          <span class="todo2__ico todo2__ico--pink">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </span>
          <span class="todo2__text">任务模板　12 个可用</span>
          <button class="todo2__btn todo2__btn--ghost">打开</button>
        </div>
      </section>

    </div>
</body>
</html>

    <nav class="pnav2" aria-label="家长端主导航">
      <button class="pnav2__item pnav2__item--on" aria-current="page">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>
        概览
      </button>
      <button class="pnav2__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 5v14h14V5"/><path d="M8.5 9.5h7M8.5 13h4.5"/></svg>
        任务
      </button>
      <button class="pnav2__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg>
        心愿
      </button>
      <button class="pnav2__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10.5" r="2.2"/><path d="M3.5 19c.5-2.8 2.7-4.3 5.5-4.3s5 1.5 5.5 4.3"/><path d="M15 14.6c2.2 0 4 1.2 4.5 3.4"/></svg>
        孩子
      </button>
      <button class="pnav2__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4"/><path d="M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>
        我的
      </button>
    </nav>

  </div>
</div>

<script src="./hf.js"></script></body></html>
