        </div>
        <div class="kline">
          <span class="kline__ico" style="background:linear-gradient(160deg,#fff0d6,#ffe0ab)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/></svg></span>
