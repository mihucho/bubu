<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 首次体验</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen  ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
    <div class="dbar">

      <div><h1 class="dbar__title">第一次来</h1><p class="dbar__sub">四件事就够</p></div>
    </div>
    <main class="scroll">    
<div style="display:flex;flex-direction:column">
      <div style="text-align:center;padding-top:8px">
        <div style="width:84px;height:84px;margin:0 auto 12px;border-radius:28px;background:linear-gradient(160deg,#fff0f7,#f3e8fe);display:flex;align-items:center;justify-content:center"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></div>
        <div style="font-size:17.0px;font-weight:800;color:#2b1147">这四件事你会用到</div>
      </div>
      <div class="klines" style="margin-top:14px">
        <div class="kline"><span class="kline__ico" style="background:linear-gradient(160deg,#ffe0ef,#ffc6e2)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span><div><div class="kline__t">点任务后面的 ＋1</div><div class="kline__s">做完一次就点一下</div></div></div>
        <div class="kline"><span class="kline__ico" style="background:linear-gradient(160deg,#fff0d6,#ffe0ab)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></span><div><div class="kline__t">星星会飞进宝箱</div><div class="kline__s">凑满一箱就能开</div></div></div>
        <div class="kline"><span class="kline__ico" style="background:linear-gradient(160deg,#ddf7e6,#c4f0d5)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v11H4z"/><path d="M4 13h16M12 9v11"/><path d="M12 9c-1.6 0-4-.6-4-2.4C8 5 10 4.7 11 6c.7 1 1 3 1 3zm0 0c1.6 0 4-.6 4-2.4 0-1.6-2-1.9-3-.6-.7 1-1 3-1 3z"/></svg></span><div><div class="kline__t">星星可以去商店换东西</div><div class="kline__s">也能攒着实现一个心愿</div></div></div>
        <div class="kline"><span class="kline__ico" style="background:linear-gradient(160deg,#f0e6ff,#e0d0ff)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.6" width="18" height="13" rx="3.2"/><path d="M4.6 8.2l7.4 5.3 7.4-5.3"/></svg></span><div><div class="kline__t">布布会先跟你说话</div><div class="kline__s">不知道说什么就点气泡</div></div></div>
      </div>
      <div class="kfoot"><button class="kbtn">我知道了</button></div>
    </div></main>

</div></div><script src="./hf.js"></script></body></html>
