<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 操作记录</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
<header class="p2head">
      <button class="p2head__back" aria-label="返回"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><h1 class="p2head__t">操作记录</h1><p class="p2head__s">最近 20 条</p></div>
    </header>

    <main class="scroll"><section class="pcard2" style="padding:0 13px">
                <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#e6f0ff,#cfe0ff)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg></span>
          <div style="flex:1;min-width:0"><div class="tr__name">编辑任务「叫叫阅读」</div><div class="tr__meta">妈妈 · 今天 09:12</div></div>
          <div class="tr__right"><div class="tr__val">查看</div><div class="tr__sub"></div></div>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#ddf7e6,#c4f0d5)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
          <div style="flex:1;min-width:0"><div class="tr__name">确认「学校作业」打卡</div><div class="tr__meta">妈妈 · 今天 18:22</div></div>
          <div class="tr__right"><div class="tr__val">查看</div><div class="tr__sub"></div></div>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#fff0d6,#ffe0ab)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></span>
          <div style="flex:1;min-width:0"><div class="tr__name">补登记跳绳 1 次</div><div class="tr__meta">妈妈 · 昨天 21:03</div></div>
          <div class="tr__right"><div class="tr__val">查看</div><div class="tr__sub"></div></div>
        </div>
      </section>
      <div class="pcard2" style="display:flex;gap:9px;align-items:flex-start">
        <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4-3 6.5-7 9-4-2.5-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <span style="font-size:12.0px;line-height:1.65;color:#3b3350">每次改数据都会留一条记录，包含谁改的、改了什么、什么时候。</span>
      </div></main>
    <nav class="pnav2" aria-label="主导航">
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>概览</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 5v14h14V5M8.5 9.5h7M8.5 13h4.5"/></svg>任务</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg>心愿</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6M16.5 8.3a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4M3.5 19c.5-2.8 2.7-4.3 5.5-4.3s5 1.5 5.5 4.3M15 14.6c2.2 0 4 1.2 4.5 3.4"/></svg>孩子</button>
      <button class="pnav2__item pnav2__item--on" aria-current="page"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.1a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script></body></html>
