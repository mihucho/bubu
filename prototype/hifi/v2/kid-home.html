<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 孩子端首页（高保真 v2）</title>
<link rel="stylesheet" href="./hf.css">
</head>
<body>

<div class="phone">
  <div class="screen">

    <!-- 状态条 -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusbar__right">
        <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg>
        <span class="statusbar__bar"></span>
      </span>
    </div>

    <div class="scroll">
      <!-- 问候 -->
      <header class="greet">
        <div class="avatar">
          <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round">
            <path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/>
            <path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/>
            <path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z" stroke="#a855f7"/>
            <circle cx="10" cy="13.4" r="1" fill="#a855f7" stroke="none"/>
            <circle cx="14" cy="13.4" r="1" fill="#a855f7" stroke="none"/>
            <path d="M10.6 16.2c.9.6 1.9.6 2.8 0"/>
          </svg>
        </div>
        <div class="greet__text">
          <h1 class="greet__name">小月亮</h1>
          <p class="greet__meta">星期四 · 今天也要来一点点</p>
        </div>
        <button class="iconbtn" aria-label="小信箱，2 条新消息">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6.5" width="18" height="13" rx="3.2"/><path d="M4.5 8l7.5 5.4L19.5 8"/>
          </svg>
          <span class="iconbtn__dot"></span>
        </button>
      </header>

      <!-- 今日宝箱 -->
      <section class="chest" aria-label="今日宝箱进度">
        <div class="chest__top">
          <h2 class="chest__title">今日宝箱</h2>
          <span class="chest__left">还差 3 个</span>
        </div>
        <div class="cells">
          <div class="cell cell--open">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="cell cell--open">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="cell cell--open">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="cell cell--next">
            <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8.5" width="17" height="12" rx="2.5"/><path d="M3.5 13h17M12 8.5v12"/><path d="M12 8.5c-1.6 0-4.2-.6-4.2-2.6 0-1.6 2.2-1.9 3.2-.6.7 1 1 3.2 1 3.2zm0 0c1.6 0 4.2-.6 4.2-2.6 0-1.6-2.2-1.9-3.2-.6-.7 1-1 3.2-1 3.2z"/></svg>
          </div>
          <div class="cell"></div>
          <div class="cell"></div>
        </div>
      </section>

      <!-- 布布说 -->
      <div class="say">
        <div class="say__ava">
          <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round"><path d="M12 3.5l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6-5.1-2.8-5.1 2.8 1.1-5.6L3.8 9.4l5.7-.7z"/></svg>
        </div>
        <p class="say__text">读了 <b>20 分钟</b>，再做 <b>1 个</b>就开宝箱</p>
        <svg class="i--sm say__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>

      <!-- 任务 -->
      <div class="section">
        <h2 class="section__title">今天要做</h2>
        <span class="section__count">1 / 3 完成</span>
      </div>

      <div class="tasks">
        <!-- 进行中 -->
        <article class="task">
          <div class="task__tile task__tile--book">
            <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.6c0-.9.7-1.6 1.6-1.6H11v16H5.6c-.9 0-1.6-.7-1.6-1.6z"/><path d="M13 4h5.4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H13z"/>
            </svg>
          </div>
          <div class="task__body">
            <div class="task__name">叫叫阅读 <span class="task__cycle">每天</span></div>
            <div class="task__meta">
              <span class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
              <span class="task__reward">
                <svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg>
                3
              </span>
            </div>
          </div>
          <button class="cta" aria-label="叫叫阅读加一次">
            <span class="cta__plus">＋1</span>
            <span class="cta__unit">打卡</span>
          </button>
        </article>

        <!-- 进行中（有拍照要求） -->
        <article class="task">
          <div class="task__tile task__tile--calc">
            <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7"/><path d="M8.5 12h2M13.5 12h2M8.5 16.5h2M13.5 16.5h2"/>
            </svg>
          </div>
          <div class="task__body">
            <div class="task__name">口算 20 题</div>
            <div class="task__meta">
              <span class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></span>
              <span class="task__reward">
                <svg class="i--sm" viewBox="0 0 24 24" fill="#ffc93c" stroke="#e0a01a" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg>
                2
              </span>
              <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#a08fb8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="需要拍照">
                <path d="M4 8.5h3.2l1.2-2.2h7.2l1.2 2.2H20v10H4z"/><circle cx="12" cy="13" r="3.2"/>
              </svg>
            </div>
          </div>
          <button class="cta" aria-label="口算加一次">
            <span class="cta__plus">＋1</span>
            <span class="cta__unit">打卡</span>
          </button>
        </article>

        <!-- 已完成 -->
        <article class="task task--done">
          <div class="task__tile task__tile--jump">
            <svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.5 4.5c5.5 0 6 3 4 7s-2 5-1 8"/><path d="M9.5 9.5c2.5 0 3.5 1 3 2.5"/>
            </svg>
          </div>
          <div class="task__body">
            <div class="task__name">跳绳 100 个</div>
            <div class="task__meta">
              <span class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>
              <button class="fixlink">已完成 · 点错了？改一下</button>
            </div>
          </div>
          <span class="stamp2" aria-label="已完成">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.6l4.8 4.8L19.6 7"/></svg>
          </span>
        </article>
      </div>

      <!-- 小世界 -->
      <div class="section" style="margin-top:12px">
        <h2 class="section__title">去看看</h2>
      </div>
      <div class="world">
        <button class="wcard">
          <span class="wcard__ico wcard__ico--shop">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          </span>
          <span class="wcard__t">星星商店</span>
          <span class="wcard__s">29 颗可用</span>
        </button>
        <button class="wcard">
          <span class="wcard__ico wcard__ico--quest">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l6-2 6 2 6-2v13l-6 2-6-2-6 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>
          </span>
          <span class="wcard__t">闯关</span>
          <span class="wcard__s">第 3 关</span>
        </button>
        <button class="wcard">
          <span class="wcard__ico wcard__ico--check">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/></svg>
          </span>
          <span class="wcard__t">签到</span>
          <span class="wcard__s">还没开</span>
        </button>
      </div>
    </div>

    <!-- 底部导航 -->
</body>
</html>
    <nav class="nav" aria-label="主导航">
      <button class="nav__item nav__item--on" aria-current="page">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>
        首页
      </button>
      <button class="nav__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v17H6a2 2 0 0 1-2-2z"/><path d="M13 3.5h5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-5z"/></svg>
        阅读
      </button>
      <button class="nav__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.4"/><path d="M6 20l3.5-6.5L12 15l3.5-6.5L19 15"/></svg>
        动起来
      </button>
      <button class="nav__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8c0 4.3-3.8 7.7-8.5 7.7-1 0-2-.2-2.9-.5L4 20.5l1.4-4.2c-1-1.3-1.5-2.9-1.5-4.5C3.9 7.5 7.7 4 12.4 4s8.1 3.5 8.1 7.8z"/></svg>
        说说话
      </button>
      <button class="nav__item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>
        我的
      </button>
    </nav>

  </div>
</div>

<script src="./hf.js"></script></body></html>
