<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 邀请另一位家长</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
<header class="p2head">
      <button class="p2head__back" aria-label="返回"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><h1 class="p2head__t">一起管的人</h1><p class="p2head__s">1 / 4 位家长</p></div>
    </header>

    <main class="scroll"><section class="pcard2">
        <div class="pcard2__head"><h2 class="pcard2__title">已经在的</h2><span class="pcard2__meta">创建人</span></div>
                <div class="kv frow frow--wide"><span>妈妈 · 138****6721</span><b>创建人 ›</b></div>
      </section>

      <section class="pcard2" style="margin-top:10px">
        <div class="pcard2__head"><h2 class="pcard2__title">邀请另一位家长</h2></div>
        <p style="font-size:13.0px;line-height:1.7;color:#3b3350;margin:0 0 10px">让 TA 在自己手机上打开布布，登录后输入这串码：</p>
        <div style="font-family:var(--f-num);font-size:19px;font-weight:800;letter-spacing:.16em;color:#6d28d9;text-align:center;background:#faf5ff;border-radius:14px;padding:14px 0;border:1.5px dashed #e9d5ff">K7M2X9</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="pbtn2 pbtn2--ghost" style="flex:1">复制</button>
          <button class="pbtn2 pbtn2--ghost" style="flex:1">二维码</button>
        </div>
        <div class="warn" style="margin-top:10px">码 24 小时内有效，用过一次就失效。对方加入后你会收到一条站内消息。</div>
      </section>

      <section class="pcard2" style="margin-top:10px">
        <div class="pcard2__head"><h2 class="pcard2__title">TA 能做什么</h2></div>
                <div class="kv frow"><span>看孩子的数据</span><b>能</b></div>
        <div class="kv frow frow--wide"><span>配置任务 / 定价 / 确认</span><b>能</b></div>
        <div class="kv frow frow--wide"><span>注销账号 / 撤回同意</span><b>仅创建人</b></div>
      </section></main>
    <nav class="pnav2" aria-label="主导航">
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>概览</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 5v14h14V5M8.5 9.5h7M8.5 13h4.5"/></svg>任务</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg>心愿</button>
      <button class="pnav2__item pnav2__item--on" aria-current="page"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6M16.5 8.3a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4M3.5 19c.5-2.8 2.7-4.3 5.5-4.3s5 1.5 5.5 4.3M15 14.6c2.2 0 4 1.2 4.5 3.4"/></svg>孩子</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.1a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script></body></html>
