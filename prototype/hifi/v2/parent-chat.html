<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 问布布</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
<header class="p2head">
      <button class="p2head__back" aria-label="返回"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><h1 class="p2head__t">问布布</h1><p class="p2head__s">两个孩子的数据</p></div>
    </header>

    <main class="scroll"><div class="seg2" style="margin:2px 0 10px">
        <button class="seg2__item seg2__item--on">全部孩子</button>
        <button class="seg2__item">小月亮</button>
        <button class="seg2__item">小米粒</button>
      </div>
      <div class="cmsg cmsg--kid" style="max-width:100%"><div class="cbubble">这周两个孩子各做了什么</div></div>
      <div class="pcard2">
        <div style="font-size:12.0px;color:#6b6480;font-weight:600;margin-bottom:6px">这周两个孩子各做了什么</div>
        <div style="font-size:13.0px;line-height:1.8;color:#3b3350">
          <b>小月亮</b>：读完 3 本，运动 4 次共 95 分钟，得 26 颗星<br>
          <b>小米粒</b>：读完 1 本（读了 3 遍），运动 2 次共 40 分钟，得 12 颗星
        </div>
        <div style="font-size:11px;color:#6b6480;margin-top:8px;padding-top:8px;border-top:1px dashed #f0e9f8">两个孩子的节奏不一样，先按各自的节奏来就挺好。</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:10px">
        <button class="quickchip" style="min-height:40px;font-size:12.0px">谁需要我多陪一会</button>
        <button class="quickchip" style="min-height:40px;font-size:12.0px">下周可以怎么调整</button>
      </div>
    </div>
    <div class="chatinput" style="padding:8px 14px 14px">
      <div class="chatinput__box" style="height:44px;font-size:13.0px">想问什么就打在这里…</div>
      <button class="chatinput__send" style="width:44px;height:44px;border-radius:14px" aria-label="发送"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></main>

</div></div><script src="./hf.js"></script></body></html>
