<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 动起来（高保真 v2）</title>
<link rel="stylesheet" href="./hf.css">
</head>
<body>
<div class="phone">
  <div class="screen ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>

    <div class="scroll">
      <header class="greet">
        <div class="avatar"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round"><path d="M7 9c-1.4-.6-2.4-2-2.4-3.3 0-.9.8-1.4 1.6-1.1.9.4 2 1.6 2.6 2.6"/><path d="M17 9c1.4-.6 2.4-2 2.4-3.3 0-.9-.8-1.4-1.6-1.1-.9.4-2 1.6-2.6 2.6"/><path d="M12 8.4c3.2 0 5.8 2.4 5.8 5.4S15.2 19.6 12 19.6 6.2 16.8 6.2 13.8 8.8 8.4 12 8.4Z" stroke="#a855f7"/><circle cx="10" cy="13.4" r="1" fill="#a855f7" stroke="none"/><circle cx="14" cy="13.4" r="1" fill="#a855f7" stroke="none"/><path d="M10.6 16.2c.9.6 1.9.6 2.8 0"/></svg></div>
        <div class="greet__text">
          <h1 class="greet__name">动起来</h1>
          <p class="greet__meta">这周 2 / 3 次 · 共 65 分钟</p>
        </div>
        <button class="iconbtn" aria-label="运动记录">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg>
        </button>
      </header>

      <section class="progcard">
        <div class="progcard__row"><span>本周 2 / 3 次</span><span>再动 1 次就达标</span></div>
        <div class="bar"><i style="width:66%"></i></div>
        <div class="progcard__row" style="margin-top:12px"><span>累计 65 分钟</span><span>达标得 2 颗星</span></div>
        <div class="bar bar--purple"><i style="width:43%"></i></div>
      </section>

      <div class="section"><h2 class="section__title">我的最好成绩</h2></div>
      <div class="klines">
        <div class="kline">
          <span class="kline__ico" style="background:linear-gradient(160deg,#ddf7e6,#c4f0d5)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5c5.5 0 6 3 4 7s-2 5-1 8"/><path d="M9.5 9.5c2.5 0 3.5 1 3 2.5"/></svg></span>
          <div><div class="kline__t">跳绳</div><div class="kline__s">一分钟最多</div></div>
          <span class="kline__v">120 个</span>
        </div>
        <div class="kline">
          <span class="kline__ico" style="background:linear-gradient(160deg,#e6f0ff,#cfe0ff)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17l3-6 3 6"/></svg></span>
          <div><div class="kline__t">骑车</div><div class="kline__s">单次最长</div></div>
          <span class="kline__v">30 分</span>
        </div>
      </div>

      <div class="section" style="margin-top:16px"><h2 class="section__title">最近</h2><span class="section__count">本周 2 次</span></div>
      <div class="klines">
        <div class="kline">
          <span class="kline__ico" style="background:linear-gradient(160deg,#fff0d6,#ffe0ab)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
          <div><div class="kline__t">跳绳 100 个</div><div class="kline__s">昨天 · 12 分钟</div></div>
          <span class="kline__v">+2 星</span>
        </div>
        <div class="kline">
          <span class="kline__ico" style="background:linear-gradient(160deg,#ffe6f4,#ffcfe6)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg></span>
          <div><div class="kline__t">骑车上学</div><div class="kline__s">周二 · 25 分钟</div></div>
          <span class="kline__v">+2 星</span>
        </div>
      </div>

      <div class="kfoot"><button class="kbtn">记录一次运动</button></div>
    </div>
</body>
</html>
    <nav class="nav" aria-label="主导航">
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>首页</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v17H6a2 2 0 0 1-2-2z"/><path d="M13 3.5h5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-5z"/></svg>阅读</button>
      <button class="nav__item nav__item--on aria-current="page""><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.4"/><path d="M6 20l3.5-6.5L12 15l3.5-6.5L19 15"/></svg>动起来</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8c0 4.3-3.8 7.7-8.5 7.7-1 0-2-.2-2.9-.5L4 20.5l1.4-4.2c-1-1.3-1.5-2.9-1.5-4.5C3.9 7.5 7.7 4 12.4 4s8.1 3.5 8.1 7.8z"/></svg>说说话</button>
      <button class="nav__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
  </div>
</div>
<script src="./hf.js"></script></body></html>
