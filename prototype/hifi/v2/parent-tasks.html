<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 任务</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>

    <header class="p2head">
      <div><h1 class="p2head__t">任务</h1><p class="p2head__s">小月亮 · 共 6 个任务</p></div>
      <button class="p2head__act">新建任务</button>
    </header>

    <div class="pbody">
      <div class="seg2" style="margin:2px 0 10px">
        <button class="seg2__item seg2__item--on">任务清单</button>
        <button class="seg2__item">运动目标</button>
        <button class="seg2__item">闯关</button>
      </div>

      <section class="pcard2" style="padding:0 13px">
        <div class="pcard2__head" style="padding:11px 0 2px;margin:0">
          <h2 class="pcard2__title">每天</h2><span class="pcard2__meta">3 个</span>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#ffe0ef,#ffc6e2)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.6c0-.9.7-1.6 1.6-1.6H11v16H5.6c-.9 0-1.6-.7-1.6-1.6z"/><path d="M13 4h5.4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H13z"/></svg></span>
          <div style="flex:1;min-width:0">
            <div class="tr__name">叫叫阅读</div>
            <div class="tr__meta">5 次 / 天 · 达标得 3 颗星</div>
            <div class="tr__tags"><span class="tag2">拍照可选</span><span class="tag2 tag2--gray">不需确认</span></div>
          </div>
          <div class="tr__right"><div class="tr__val">3 / 5</div><div class="tr__sub">今天</div></div>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#e6e5ff,#d3d0fb)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h2M13.5 12h2"/></svg></span>
          <div style="flex:1;min-width:0">
            <div class="tr__name">口算 20 题</div>
            <div class="tr__meta">5 次 / 天 · 达标得 2 颗星</div>
            <div class="tr__tags"><span class="tag2">拍照必填</span><span class="tag2 tag2--amber">需要我确认</span></div>
          </div>
          <div class="tr__right"><div class="tr__val">1 / 5</div><div class="tr__sub">今天</div></div>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#ddf7e6,#c4f0d5)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5c5.5 0 6 3 4 7s-2 5-1 8"/></svg></span>
          <div style="flex:1;min-width:0">
            <div class="tr__name">跳绳 100 个</div>
            <div class="tr__meta">1 次 / 天 · 达标得 2 颗星</div>
            <div class="tr__tags"><span class="tag2 tag2--gray">不需要拍照</span></div>
          </div>
          <div class="tr__right"><div class="tr__val">1 / 1</div><div class="tr__sub" style="color:#15803d">已完成</div></div>
        </div>
      </section>

      <section class="pcard2" style="padding:0 13px;margin-top:10px">
        <div class="pcard2__head" style="padding:11px 0 2px;margin:0">
          <h2 class="pcard2__title">每周</h2><span class="pcard2__meta">2 个</span>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#fff0d6,#ffe0ab)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16v13H4z"/><path d="M8 6.5V4.5h8v2"/></svg></span>
          <div style="flex:1;min-width:0">
            <div class="tr__name">学校作业</div>
            <div class="tr__meta">5 次 / 周 · 达标得 3 颗星</div>
            <div class="tr__tags"><span class="tag2">拍照可选</span><span class="tag2 tag2--amber">需要我确认</span></div>
          </div>
          <div class="tr__right"><div class="tr__val">3 / 5</div><div class="tr__sub">本周</div></div>
        </div>
      </section>

      <div class="pcard2" style="margin-top:10px;display:flex;align-items:center;gap:9px">
        <svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span style="font-size:12.0px;font-weight:600;color:#3b3350">任务模板　还有 12 个可以直接用</span>
        <button class="todo2__btn todo2__btn--ghost" style="margin-left:auto">打开</button>
      </div>
    </div>
    <nav class="pnav2" aria-label="家长端主导航">
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>概览</button>
      <button class="pnav2__item pnav2__item--on" aria-current="page"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 5v14h14V5M8.5 9.5h7M8.5 13h4.5"/></svg>任务</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.6-4-6.6-8.6A3.8 3.8 0 0 1 12 9a3.8 3.8 0 0 1 6.6 2.4C18.6 16 12 20 12 20z"/></svg>心愿</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6M16.5 8.3a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4M3.5 19c.5-2.8 2.7-4.3 5.5-4.3s5 1.5 5.5 4.3M15 14.6c2.2 0 4 1.2 4.5 3.4"/></svg>孩子</button>
      <button class="pnav2__item"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.1a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8M4.8 20c.7-3.4 3.6-5.3 7.2-5.3s6.5 1.9 7.2 5.3"/></svg>我的</button>
    </nav>
</div></div><script src="./hf.js"></script>
</body></html>
