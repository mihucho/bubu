<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 选一套模板</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen screen--parent ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
    <main class="scroll"><div class="scroll" style="display:flex;flex-direction:column">
      <div class="gsteps"><span class="gdot gdot--done"></span><span class="gdot gdot--done"></span><span class="gdot gdot--done"></span><span class="gdot gdot--done"></span><span class="gdot"></span><span class="gdot"></span><span class="gdot"></span><span class="gdot"></span></div>
      <div style="padding:6px 24px 0">
        <div style="font-size:12.0px;font-weight:700;color:#7c3aed;letter-spacing:.4px">第 4 步 / 共 8 步</div>
        <h1 style="margin:6px 0 4px;font-size:19px;font-weight:800;color:#2b1147">选一套模板</h1>
        <p style="margin:0 0 14px;font-size:12.0px;line-height:1.7;color:#7c5a9e">不必从空白开始，先选一套，之后随时改。</p>
        <div class="pcard2" style="padding:0 13px">        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#ffe0ef,#ffc6e2)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.6c0-.9.7-1.6 1.6-1.6H11v16H5.6c-.9 0-1.6-.7-1.6-1.6z"/><path d="M13 4h5.4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H13z"/></svg></span>
          <div style="flex:1;min-width:0"><div class="tr__name">小学生日常</div><div class="tr__meta">阅读 + 口算 + 运动</div></div>
          <div class="tr__right"><div class="tr__val">已选</div><div class="tr__sub"></div></div>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:linear-gradient(160deg,#ddf7e6,#c4f0d5)"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5c5.5 0 6 3 4 7s-2 5-1 8"/><path d="M9.5 9.5c2.5 0 3.5 1 3 2.5"/></svg></span>
          <div style="flex:1;min-width:0"><div class="tr__name">运动优先</div><div class="tr__meta">跳绳 + 骑车 + 家务</div></div>
          <div class="tr__right"><div class="tr__val">选择</div><div class="tr__sub"></div></div>
        </div>
        <div class="tr">
          <span class="tr__ico" style="background:#f5f1fa"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="#6b6480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg></span>
          <div style="flex:1;min-width:0"><div class="tr__name">空白开始</div><div class="tr__meta">自己一个个加</div></div>
          <div class="tr__right"><div class="tr__val">选择</div><div class="tr__sub"></div></div>
        </div></div>
      </div>
      <div style="margin-top:auto;padding:16px 24px">
        <button class="kbtn">下一步</button>
        <button class="gstep-back">上一步</button>
      </div>
    </div></main>

</div></div><script src="./hf.js"></script></body></html>
