<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>布布 · 记录一次运动</title><link rel="stylesheet" href="./hf.css"></head>
<body><div class="phone"><div class="screen  ">
    <div class="statusbar"><span>9:41</span><span class="statusbar__right"><svg class="i--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17.5h2.5M9 14h2.5M15 10.5h2.5M21 7h2.5"/></svg><span class="statusbar__bar"></span></span></div>
    <div class="screen-sheet-bg">
      <div class="scroll" style="opacity:.35">
        <div class="greet"><div class="avatar"><svg class="i--lg" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.6c0-.9.7-1.6 1.6-1.6H11v16H5.6c-.9 0-1.6-.7-1.6-1.6z"/><path d="M13 4h5.4c.9 0 1.6.7 1.6 1.6v12.8c0 .9-.7 1.6-1.6 1.6H13z"/></svg></div><div class="greet__text"><h1 class="greet__name">首页</h1><p class="greet__meta">背景内容</p></div></div>
      </div>
      <div class="sheetpanel ">
        <div class="sheetpanel__grab"></div>
        <h2 class="sheetpanel__t">记录一次运动</h2>
                <div class="srow"><span class="srow__k">做了什么</span><div class="srow__v srow__v--text">跳绳</div></div>
        <div class="srow"><span class="srow__k">多久</span><div class="srow__v srow__v--text">12 分钟</div></div>
        <div class="srow"><span class="srow__k">拍了照片</span><div class="srow__v srow__v--text">已拍 1 张</div></div>
        <div class="sheetpanel__btns">
          <button class="kbtn kbtn--ghost">取消</button>
          <button class="kbtn">记下来</button>
        </div>
      </div>
    </div>

</div></div><script src="./hf.js"></script></body></html>
